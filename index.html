html{scroll-behavior:smooth;}

button{font-family:inherit;-webkit-tap-highlight-color:transparent;}

/* Focus */
*:focus-visible{outline:2px solid #D4A017;outline-offset:2px;border-radius:4px;}

/* Animations */

/* Phase transitions */
.phase{animation:fadeIn 0.35s ease-out both;}

/* Splash */
#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;

.btn{padding:14px 24px;border:none;border-radius:10px;font-weight:700;font-size:14px;letter-spacing:0.3px;
  cursor:pointer;transition:all 0.15s ease;position:relative;overflow:hidden;

.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 4px 12px rgba(212,160,23,0.3);}
.btn:active{transform:translateY(0) scale(0.97);filter:brightness(0.95);box-shadow:none;}
.btn:disabled{background:#444;color:#888;opacity:0.5;cursor:not-allowed;transform:none;filter:none;box-shadow:none;}

.alloc-btn{width:44px;height:44px;border-radius:50%;font-size:20px;font-weight:700;
  cursor:pointer;transition:all 0.12s ease;display:flex;align-items:center;justify-content:center;line-height:1;}
.alloc-btn:hover:not(:disabled){transform:scale(1.12);}
.alloc-btn:active:not(:disabled){transform:scale(0.88);}
.alloc-btn:disabled{cursor:not-allowed;opacity:0.2;}

/* Department cards */
.dept-card{border-radius:10px;padding:12px 16px;margin-bottom:8px;transition:all 0.2s ease;cursor:default;}
.dept-card:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,0.2);}

/* Score bar fill */
.score-fill{height:100%;border-radius:6px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1);}

/* Tool links */
.tool-link{display:flex;align-items:center;gap:10px;border-radius:8px;padding:10px 14px;margin-bottom:5px;
  text-decoration:none;transition:all 0.15s ease;}
.tool-link:hover{transform:translateX(3px);}

/* Voice cards */
.voice-card{border-radius:10px;padding:12px 14px;margin-bottom:8px;transition:all 0.2s ease;}

/* Progress */
.progress{display:flex;gap:8px;justify-content:center;padding:10px 0 4px;}
.progress-dot{width:10px;height:10px;border-radius:50%;transition:all 0.3s ease;}
.progress-dot.done{background:#D4A017;}
.progress-dot.active{background:#D4A017;animation:pulse 1.5s ease infinite;}
.progress-dot.future{background:rgba(255,255,255,0.12);}

/* Grade circle */
.grade-circle{animation:gradeReveal 0.6s cubic-bezier(0.34,1.56,0.64,1) both;}

/* Chart legend */
.chart-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:6px 0 2px;}
.chart-legend span{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;}
.chart-legend span::before{content:'';width:10px;height:3px;border-radius:2px;display:inline-block;}

/* HC overrides */
.hc .progress-dot.future{background:rgba(0,0,0,0.15);}

function ScoreChart({data,t}){
  if(!data||data.length<2)return null;
  const W=360,H=150,P={t:12,r:16,b:22,l:32},pW=W-P.l-P.r,pH=H-P.t-P.b;
  return(<div>
    <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",display:"block"}} role="img" aria-label="Score evolution chart">
      {[0,25,50,75,100].map(v=>{const y=P.t+pH-(v/100)*pH;return(<g key={v}><line x1={P.l} y1={y} x2={W-P.r} y2={y} stroke={t.cardBorder} strokeWidth={0.5}/><text x={P.l-4} y={y+3} fontSize={8} fill={t.muted} textAnchor="end">{v}</text></g>);})}
      {data.map((d,i)=>{const x=P.l+(i/(data.length-1))*pW;return <text key={i} x={x} y={H-4} fontSize={8} fill={t.muted} textAnchor="middle">{d.year}</text>;})}
      {SCORE_META.map(({key,color})=>{const pts=data.map((d,i)=>({x:P.l+(i/(data.length-1))*pW,y:P.t+pH-((d[key]||0)/100)*pH}));const path=pts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");return(<g key={key}><path d={path} fill="none" stroke={color} strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"/>{pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r={3} fill={color} stroke={t.bg} strokeWidth={1.5}/>)}</g>);})}
    </svg>
    <div className="chart-legend">
      {SCORE_META.map(s=><span key={s.key} style={{color:t.muted}}><span style={{display:"inline-block",width:10,height:3,borderRadius:2,background:s.color,marginRight:3}}/>{s.label}</span>)}
    </div>
  </div>);
}

        <p style={{fontSize:10.5,color:t.muted,margin:0,lineHeight:1.65}}>Pew Charitable Trusts, "Philadelphia 2026: State of the City," April 2026 · Brookings Institution, "SE Pennsylvania Market Assessment," July 2025 · Pew, "Gen Z Likes Philadelphia," August 2026 · Pew, "Philadelphia's Guiding Document at 75," March 2026 · Opportunity Insights, economic mobility data</p>
      </div>
      <Btn onClick={shareResults} style={{width:"100%",marginBottom:10,background:copied?"#16a34a":"#D4A017"}}>{copied?"✓ Copied to clipboard!":"📋 Share Your Results on LinkedIn"}</Btn>
      <div style={{background:t.accentBg,border:"1px solid "+(hc?"#ddb":"rgba(212,160,23,0.12)"),borderRadius:12,padding:16,marginBottom:16,textAlign:"center"}}>
        <p style={{fontSize:12.5,color:t.muted,margin:0,lineHeight:1.7}}>Built by <strong style={{color:t.accent}}>Nico Meyering, MPA</strong><br/><span style={{fontSize:11,color:t.faint}}>Chairman, Mayor's Commission on People with Disabilities<br/>VP, Net Impact Philadelphia · Board, Disability Pride PA<br/>Steering Committee, Transit Forward Philadelphia</span></p>
      </div>
      <Btn onClick={startGame} style={{width:"100%"}}>PLAY AGAIN</Btn>
    </div></div>);
  }
  return null;
}

ReactDOM.render(<SimPhilly2000/>,document.getElementById("root"));
</script>
