function ScoreChart({data,t,lang}){if(!data||data.length<2)return null;const W=360,H=150,P={t:12,r:16,b:22,l:32},pW=W-P.l-P.r,pH=H-P.t-P.b;return(<div><svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",display:"block"}} role="img" aria-label="Score chart">{[0,25,50,75,100].map(v=>{const y=P.t+pH-(v/100)*pH;return(<g key={v}><line x1={P.l} y1={y} x2={W-P.r} y2={y} stroke={t.cb} strokeWidth={0.5}/><text x={P.l-4} y={y+3} fontSize={8} fill={t.m} textAnchor="end">{v}</text></g>)})}{data.map((d,i)=>{const x=P.l+(i/(data.length-1))*pW;return <text key={i} x={x} y={H-4} fontSize={8} fill={t.m} textAnchor="middle">{d.year}</text>})}{SM.map(({key,color})=>{const pts=data.map((d,i)=>({x:P.l+(i/(data.length-1))*pW,y:P.t+pH-((d[key]||0)/100)*pH}));const path=pts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");return(<g key={key}><path d={path} fill="none" stroke={color} strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"/>{pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r={3} fill={color} stroke={t.bg} strokeWidth={1.5}/>)}</g>)})}</svg><div className="chart-legend">{SM.map(s=><span key={s.key} style={{color:t.m,fontSize:10,fontWeight:600,display:"flex",alignItems:"center",gap:3}}><span style={{width:10,height:3,borderRadius:2,background:s.color,display:"inline-block"}}/>{lang==="es"?s.labelEs:s.label}</span>)}</div></div>)}
function SB({label,value,color,icon,delta,hc}){return(<div style={{marginBottom:7}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3,fontWeight:600,color:hc?"#111":"#d0c8b8"}}><span>{icon} {label}</span><span style={{display:"flex",alignItems:"center",gap:4}}>{delta!==undefined&&delta!==0&&<span style={{color:delta>0?"#16a34a":"#dc2626",fontSize:11,fontWeight:700}}>{delta>0?"+":""}{Math.round(delta)}</span>}{Math.round(value)}</span></div><div style={{height:14,borderRadius:7,background:hc?"#ddd":"rgba(255,255,255,0.08)",overflow:"hidden"}}><div className="score-fill" style={{width:cl(value)+"%",background:color}}/></div></div>)}
function OpinionBar({value,hc,label}){return(<div style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3,fontWeight:600,color:hc?"#111":"#d0c8b8"}}><span>🗳️ {label}</span><span>{Math.round(value)}</span></div><div style={{height:8,borderRadius:4,background:hc?"#ddd":"rgba(255,255,255,0.08)",overflow:"hidden"}}><div className="opinion-bar" style={{width:cl(value)+"%"}}/></div></div>)}
function Btn({children,onClick,style,disabled,cls}){return <button className={"btn "+(cls||"")} onClick={onClick} disabled={disabled} style={style}>{children}</button>}
function Logo({hc}){return(<div style={{display:"inline-flex",alignItems:"baseline",gap:4}}><span style={{background:"linear-gradient(135deg,#D4A017,#f4d03f)",padding:"1px 8px",fontSize:14,fontWeight:900,color:"#1a1a2e",letterSpacing:1,borderRadius:2}}>SIM</span><span style={{fontSize:18,fontWeight:900,color:hc?"#111":"#fff",letterSpacing:1}}>PHILLY</span><span style={{fontSize:12,fontWeight:700,color:"#D4A017"}}>2000</span></div>)}
function Prog({round,total}){return(<div className="progress">{Array.from({length:total},(_,i)=><div key={i} className={"progress-dot "+(i<round-1?"done":i===round-1?"active":"future")}/>)}</div>)}
function VC({rk,text,hc,cont}){const r=RES[rk];return(<div className="voice-card" style={{background:hc?"#f0f0f0":"rgba(255,255,255,0.04)",border:hc?"1px solid #bbb":"1px solid rgba(255,255,255,0.06)"}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}><span style={{fontSize:18,lineHeight:1}}>{r.icon}</span><div><span style={{fontSize:12,fontWeight:700,color:hc?"#111":"#d0c8b8"}}>{r.name}</span><span style={{fontSize:11,color:hc?"#555":"#778",marginLeft:6}}>{r.age} · {r.loc}</span></div></div><p style={{fontSize:12.5,color:hc?"#333":"#a8a098",margin:0,lineHeight:1.55,fontStyle:"italic"}}>"{cont?cont+" ":""}{text}"</p></div>)}

/* ═══ MAIN APP ═══ */
function App(){
  const [ph,setPh]=useState("title");
  const [rnd,setRnd]=useState(1);
  const [sc,setSc]=useState({...INIT});
  const [prev,setPrev]=useState(null);
  const [al,setAl]=useState(Object.fromEntries(DEPTS.map(d=>[d.id,0])));
  const [evts,setEvts]=useState([]);
  const [ce,setCe]=useState(null);
  const [er,setEr]=useState(null);
  const [hist,setHist]=useState([]);
  const [sh,setSh]=useState([{year:"Start",...INIT}]);
  const [hc,setHc]=useState(false);
  const [cp,setCp]=useState(false);
  const [tb,setTb]=useState(false);
  const [diff,setDiff]=useState("normal");
  const [mut,setMut]=useState(false);
  const [lb,setLb]=useState(getLB());
  const [saved,setSaved]=useState(false);
  const [carry,setCarry]=useState(null);
  const [lang,setLang]=useState("en");
  const [opinion,setOpinion]=useState(45);
  const [surplus,setSurplus]=useState(0);
  const [surplusCount,setSurplusCount]=useState(0);
  const [shaking,setShaking]=useState(false);
  const [autoplay,setAutoplay]=useState(false);
  const [showEmbed,setShowEmbed]=useState(false);
  const [fact,setFact]=useState("");

  useEffect(()=>{const s=document.getElementById("splash");if(s)setTimeout(()=>s.classList.add("hidden"),300)},[]);
  useEffect(()=>{window.scrollTo({top:0})},[ph,rnd]);
  useEffect(()=>{SFX.muted=mut},[mut]);
  // Check URL seed
  const urlSeed=useMemo(()=>getSeed(),[]);

  // Autoplay
  useEffect(()=>{
    if(!autoplay)return;
    const timer=setTimeout(()=>{
      if(ph==="title"){start()}
      else if(ph==="intro"){setPh("alloc")}
      else if(ph==="alloc"){
        const na={};let rem=df.pts+surplus;DEPTS.forEach((d,i)=>{const p=Math.min(Math.ceil(rem/Math.max(1,DEPTS.length-i)),rem);na[d.id]=p;rem-=p});setAl(na);setTimeout(()=>confirm(),800);
      }
      else if(ph==="event"){resolve()}
      else if(ph==="over"){setAutoplay(false)}
    },ph==="alloc"?1500:2000);
    return()=>clearTimeout(timer);
  },[autoplay,ph]);

  const df=DIFFS.find(d=>d.id===diff)||DIFFS[1];
  const budget=df.pts+surplus;
  const spent=Object.values(al).reduce((a,b)=>a+b,0);
  const rem=budget-spent;
  const t=hc?{bg:"#fff",tx:"#111",m:"#444",f:"#888",cb:"#bbb",cg:"#f0f0f0",acc:"#b8860b",abg:"rgba(184,134,11,0.08)",grad:"#f8f8f8"}:{bg:"#10172a",tx:"#e0d8c8",m:"#8890a4",f:"#3a4260",cb:"rgba(255,255,255,0.06)",cg:"rgba(255,255,255,0.03)",acc:"#D4A017",abg:"rgba(212,160,23,0.07)",grad:"radial-gradient(ellipse at 50% 30%,#1f2d50 0%,#10172a 70%)"};

  const start=useCallback(()=>{SFX.init();SFX.play('click');setRnd(1);setSc({...INIT});setPrev(null);setAl(Object.fromEntries(DEPTS.map(d=>[d.id,0])));
    const seed=urlSeed||Math.floor(Math.random()*100000);
    setEvts(seededShuffle(EV,seed).slice(0,ROUNDS));
    setCe(null);setEr(null);setHist([]);setSh([{year:"Start",...INIT}]);setCp(false);setTb(false);setSaved(false);setCarry(null);setOpinion(45);setSurplus(0);setSurplusCount(0);setFact(FACTS[Math.floor(Math.random()*FACTS.length)]);setPh("intro")},[urlSeed]);

  const adj=useCallback((dept,delta)=>{SFX.play('click');setAl(prev=>{const next=prev[dept]+delta;const others=Object.entries(prev).filter(([k])=>k!==dept).reduce((s,[,v])=>s+v,0);if(next<0||others+next>budget)return prev;return{...prev,[dept]:next}})},[budget]);

  const confirm=useCallback(()=>{
    SFX.play('click');
    const hasTrust=al.policy>=2;setTb(hasTrust);
    const opinionMult=opinion>60?1.1:opinion<30?0.9:1.0;
    const trustMult=hasTrust?1.15:1.0;
    const ns={...sc};
    if(carry)Object.entries(carry).forEach(([k,v])=>{ns[k]=cl(ns[k]+v)});
    // Check crisis chain: if prev event failed and had a chain, force that event
    let curEvts=[...evts];
    if(hist.length>0){const lastH=hist[hist.length-1];if(!lastH.mit){const lastEv=EV.find(e=>e.id===lastH.eid);if(lastEv&&lastEv.chain){const chainEv=EV.find(e=>e.id===lastEv.chain);if(chainEv&&rnd<=ROUNDS){curEvts=[...curEvts];curEvts[rnd-1]=chainEv;setEvts(curEvts)}}}}
    Object.entries(al).forEach(([dept,pts])=>{const factor=(dept==="policy"?1.0:trustMult)*opinionMult;Object.entries(IMP[dept]).forEach(([sk,m])=>{ns[sk]=cl(ns[sk]+pts*m*factor)})});
    setPrev({...sc});setSc(ns);
    const ev=curEvts[rnd-1];setCe(ev);const invested=al[ev.by]||0;const mitigated=invested>=2;
    const rs={...ns};
    if(ev.dmg)Object.entries(ev.dmg).forEach(([k,v])=>{rs[k]=cl(rs[k]+v*df.dm*(mitigated?0.35:1))});
    if(ev.bon)Object.entries(ev.bon).forEach(([k,v])=>{rs[k]=cl(rs[k]+v*df.bm*(mitigated?1:0.25))});
    setEr({mit:mitigated,msg:mitigated?ev.ym:ev.nm,before:ns,after:rs});
    setHist(prev=>[...prev,{rnd,al:{...al},eid:ev.id,mit:mitigated}]);
    // Public opinion
    setOpinion(o=>cl(mitigated?o+6:o-8));
    // Carryover
    if(!mitigated&&ev.dmg){const worst=Object.entries(ev.dmg).sort(([,a],[,b])=>a-b)[0];setCarry({[worst[0]]:-3})}else{setCarry(null)}
    // Budget surplus carry
    if(rem>0){setSurplus(Math.floor(rem*0.5));setSurplusCount(c=>c+1)}else{setSurplus(0)}
    // Screen shake on crisis
    if(!mitigated&&ev.dmg){setShaking(true);setTimeout(()=>setShaking(false),400)}
    setTimeout(()=>{mitigated?SFX.play('success'):SFX.play('crisis')},300);
    setFact(FACTS[Math.floor(Math.random()*FACTS.length)]);
    setPh("event");
  },[sc,al,evts,rnd,df,carry,opinion,rem,hist]);

  const resolve=useCallback(()=>{SFX.play('click');setSc(er.after);setSh(prev=>[...prev,{year:(lang==="es"?"Año ":"Year ")+rnd,...Object.fromEntries(Object.keys(er.after).map(k=>[k,Math.round(er.after[k])]))}]);if(rnd>=ROUNDS){SFX.play('grade');setPh("over");return}setRnd(r=>r+1);setAl(Object.fromEntries(DEPTS.map(d=>[d.id,0])));setPrev(null);setPh("alloc")},[er,rnd,lang]);

  // Keyboard shortcuts
  useEffect(()=>{const h=(e)=>{if(ph!=="alloc")return;const n=parseInt(e.key);if(n>=1&&n<=6){e.preventDefault();const d=DEPTS[n-1];if(e.shiftKey){adj(d.id,-1)}else if(rem>0){adj(d.id,1)}}if((e.key===" "||e.key==="Enter")&&spent>0){e.preventDefault();confirm()}};window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)},[ph,rem,spent,adj,confirm]);

  // Character continuity
  function getCont(rk){const prevEvts=hist.filter(h=>{const v=VO[h.eid];return v&&v.some(x=>x.r===rk)});if(prevEvts.length===0)return"";const last=prevEvts[prevEvts.length-1];const lastEv=EV.find(e=>e.id===last.eid);if(!lastEv)return"";return last.mit?"After "+lastEv.title.split(" ").slice(0,3).join(" ").toLowerCase()+"… things improved. But now —":"After "+lastEv.title.split(" ").slice(0,3).join(" ").toLowerCase()+"… things were already hard. And now —"}

  const avg=Math.round(Object.values(sc).reduce((a,b)=>a+b,0)/4);
  const grade=GR.find(g=>avg>=g.min)||GR[GR.length-1];
  const md=ce?DM[ce.by]:null;
  const totals=useMemo(()=>{const tot=Object.fromEntries(DEPTS.map(d=>[d.id,0]));hist.forEach(h=>{Object.entries(h.al).forEach(([k,v])=>{tot[k]+=v})});return tot},[hist]);
  const gSt=useMemo(()=>gs(totals),[totals]);
  const mitC=hist.filter(h=>h.mit).length;
  const disSc=useMemo(()=>{let s=0;DEPTS.forEach(d=>{s+=((totals[d.id]||0)*(d.dw||0))});return s},[totals]);
  const disA=DA.find(d=>disSc>=d.min)||DA[DA.length-1];
  const epilogue=EPILOGUES[grade.g]||EPILOGUES.F;

  // Achievements
  const unlockedAchs=useMemo(()=>ACHS.filter(a=>a.ck(grade,hist,sc,diff,disA,surplusCount)).map(a=>a.id),[grade,hist,sc,diff,disA,surplusCount]);
  useEffect(()=>{if(ph==="over"&&!saved){setLb(saveLB(grade.g,avg,gSt.t,disA.t));if(unlockedAchs.length)saveAch(unlockedAchs);setSaved(true)}},[ph,saved]);

  const share=useCallback(()=>{const txt="🏛️ I just governed Philadelphia in SimPhilly 2000!\n\nGrade: "+grade.g+" — "+(lang==="es"?grade.tEs:grade.t)+"\n⚖️ Equity: "+Math.round(sc.equity)+" | 🛡️ Resilience: "+Math.round(sc.resilience)+" | 🌱 Carbon: "+Math.round(sc.carbon)+" | ❤️ Health: "+Math.round(sc.health)+"\nStyle: "+(lang==="es"?gSt.tEs:gSt.t)+"\n♿ "+(lang==="es"?disA.tEs:disA.t)+"\n\nhttps://meyeringn.github.io/sim-philly-2000\n#SimPhilly2000 #ClimateEquity #Philadelphia";navigator.clipboard.writeText(txt).then(()=>setCp(true)).catch(()=>{})},[grade,sc,gSt,disA,lang]);
  const tweetUrl=useMemo(()=>"https://twitter.com/intent/tweet?text="+encodeURIComponent("I just governed Philadelphia in SimPhilly 2000! Grade: "+grade.g+" — "+grade.t+". Can you do better? 🏛️\nhttps://meyeringn.github.io/sim-philly-2000\n#SimPhilly2000 #ClimateEquity"),[grade]);
  const challengeUrl=useMemo(()=>{const seed=Math.floor(Math.random()*99999);return window.location.origin+window.location.pathname+"?seed="+seed},[]);
  const embedCode='<iframe src="https://meyeringn.github.io/sim-philly-2000" width="480" height="800" style="border:none;border-radius:12px" title="SimPhilly 2000"></iframe>';

  const shell={minHeight:"100vh",background:t.bg,color:t.tx,maxWidth:480,margin:"0 auto"};
  const bar={background:"linear-gradient(135deg,#D4A017 0%,#b8860b 100%)",padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"};
  const hcB={background:"none",border:"1px solid "+(hc?"#888":"rgba(255,255,255,0.25)"),borderRadius:6,padding:"4px 8px",fontSize:11,fontWeight:700,color:hc?"#444":"#1a1a2e",cursor:"pointer"};
  const sec={padding:"16px 20px"};
  const cd=(active,color)=>({background:active?(color+(hc?"22":"10")):t.cg,border:"1px solid "+(active?(color+(hc?"55":"35")):t.cb)});
  const headerBtns=<div style={{display:"flex",alignItems:"center",gap:3}}>
    <button onClick={()=>{setLang(lang==="en"?"es":"en")}} style={{...hcB,fontSize:10}} aria-label="Toggle language">{lang==="en"?"ES":"EN"}</button>
    <button onClick={()=>{setMut(!mut);SFX.play('click')}} style={hcB} aria-label="Toggle sound">{mut?"🔇":"🔊"}</button>
    <button onClick={()=>setHc(!hc)} style={hcB} aria-label="Toggle contrast">{hc?"◑":"◐"}</button>
  </div>;

  /* ── TITLE ── */
  if(ph==="title")return(
    <div style={shell} className={hc?"hc":""}><div key="title" className="phase" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:32,textAlign:"center",background:t.grad,position:"relative"}}>
      <div style={{position:"absolute",top:16,right:16}}>{headerBtns}</div>
      <Skyline hc={hc}/>
      <div style={{display:"inline-flex",alignItems:"baseline",gap:6,marginBottom:6}}>
        <span style={{background:"linear-gradient(135deg,#D4A017,#f4d03f)",padding:"3px 16px",fontSize:28,fontWeight:900,color:"#1a1a2e",letterSpacing:1,borderRadius:3}}>SIM</span>
        <span style={{fontSize:44,fontWeight:900,color:hc?"#111":"#fff",letterSpacing:4}}>PHILLY</span>
        <span style={{fontSize:24,fontWeight:700,color:"#D4A017"}}>2000</span>
      </div>
      <p style={{fontSize:11,letterSpacing:5,marginBottom:36,color:t.acc,fontWeight:600}}>{T("subtitle",lang)}</p>
      <div style={{display:"flex",gap:16,marginBottom:32,fontSize:28}}>{DEPTS.map(d=><span key={d.id} style={{opacity:0.7}}>{d.icon}</span>)}</div>
      <p style={{fontSize:14,maxWidth:300,lineHeight:1.7,marginBottom:28,color:t.m}}>{T("tagline",lang)}<br/>{T("tagQ",lang)}</p>
      <div style={{display:"flex",gap:10,marginBottom:16}}>
        <Btn onClick={start} style={{fontSize:17,padding:"16px 40px",borderRadius:12}}>{T("newGame",lang)}</Btn>
        <Btn onClick={()=>{setAutoplay(true);start()}} cls="btn-ghost" style={{fontSize:13,padding:"16px 20px",borderRadius:12,border:"1px solid "+t.acc,color:t.acc}}>{T("autoplay",lang)}</Btn>
      </div>
      {lb.length>0&&<div style={{marginTop:16,width:"100%",maxWidth:280}}>
        <p style={{fontSize:10,fontWeight:700,color:t.f,letterSpacing:1,marginBottom:6}}>{T("leaderboard",lang)}</p>
        {lb.slice(0,3).map((s,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:11,color:t.m,padding:"3px 0",borderBottom:"1px solid "+t.cb}}><span>{i+1}. {s.sty}</span><span style={{fontWeight:700,color:t.acc}}>{s.g} ({s.avg})</span></div>)}
      </div>}
      <p style={{fontSize:10,marginTop:20,color:t.f,lineHeight:1.7}}>{T("builtBy",lang)}<br/>{T("rated",lang)}</p>
    </div></div>
  );

  /* ── INTRO ── */
  if(ph==="intro")return(
    <div style={shell} className={hc?"hc":""}><div style={bar}><Logo hc={hc}/>{headerBtns}</div>
    <div key="intro" className="phase" style={sec}>
      <h2 style={{fontSize:22,fontWeight:800,margin:"0 0 16px",color:t.acc}}>{T("welcome",lang)}</h2>
      <p style={{fontSize:14,lineHeight:1.75,marginBottom:16,color:t.m}} dangerouslySetInnerHTML={{__html:T("introP1",lang)}}/>
      <p style={{fontSize:14,lineHeight:1.75,marginBottom:18,color:t.m}} dangerouslySetInnerHTML={{__html:T("introP2",lang)}}/>
      <div style={{background:t.abg,border:"1px solid "+(hc?"#ddb":"rgba(212,160,23,0.18)"),borderRadius:10,padding:16,marginBottom:14}}>
        <p style={{fontSize:14,fontWeight:700,color:t.acc,margin:"0 0 4px",fontStyle:"italic"}}>{T("moreBudget",lang)}</p>
        <p style={{fontSize:12,color:t.m,margin:0}}>{T("govAccord",lang)}</p>
      </div>
      <p style={{fontSize:12,fontWeight:700,color:t.m,margin:"0 0 8px"}}>{T("difficulty",lang)}</p>
      <div style={{display:"flex",gap:8,marginBottom:14}}>{DIFFS.map(d=>(
        <button key={d.id} className={"btn "+(diff===d.id?"":"btn-ghost")+(diff===d.id?" active":"")} onClick={()=>{setDiff(d.id);SFX.play('click')}} style={{flex:1,padding:"10px 8px",fontSize:13}}>
          <div style={{fontWeight:700}}>{T(d.id,lang)}</div><div style={{fontSize:10,opacity:0.7,marginTop:2}}>{d.pts} {T("ptsYear",lang)}</div>
        </button>
      ))}</div>
      <div style={{background:hc?"rgba(123,78,163,0.06)":"rgba(123,78,163,0.1)",border:"1px solid "+(hc?"#b8b":"rgba(123,78,163,0.2)"),borderRadius:10,padding:16,marginBottom:14}}>
        <p style={{fontSize:12,fontWeight:700,color:"#9b6ec4",margin:"0 0 4px"}}>📋 {T("civicTrust",lang)}</p>
        <p style={{fontSize:12,color:t.m,margin:0,lineHeight:1.5}}>{T("trustDesc",lang)} <strong style={{color:t.tx}}>{T("trustBoost",lang)}</strong></p>
      </div>
      <div style={{background:t.abg,border:"1px solid "+(hc?"#ddb":"rgba(212,160,23,0.18)"),borderRadius:10,padding:16,marginBottom:24}}>
        <p style={{fontSize:12,color:t.acc,margin:0,fontWeight:700}}>{T("startCond",lang)}</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px 16px",marginTop:10}}>{SM.map(s=><span key={s.key} style={{fontSize:12,color:t.m}}>{s.icon} {lang==="es"?s.labelEs:s.label}: <strong style={{color:t.tx}}>{INIT[s.key]}</strong></span>)}</div>
      </div>
      <Btn onClick={()=>{SFX.play('click');setPh("alloc")}} style={{width:"100%"}}>{T("begin",lang)} 1 →</Btn>
    </div></div>
  );

  /* ── ALLOCATE ── */
  if(ph==="alloc")return(
    <div style={shell} className={hc?"hc":""}><div style={bar}><Logo hc={hc}/><div style={{display:"flex",alignItems:"center",gap:6}}>{headerBtns}<span style={{fontWeight:700,fontSize:12,color:"#1a1a2e",opacity:0.7,marginLeft:4}}>{T("year",lang)} {rnd}</span></div></div>
    <Prog round={rnd} total={ROUNDS}/>
    <div key={"a"+rnd} className="phase" style={sec} role="region" aria-live="polite">
      {carry&&<div style={{background:"rgba(248,113,113,0.08)",border:"1px solid rgba(248,113,113,0.2)",borderRadius:8,padding:"8px 14px",marginBottom:10,textAlign:"center"}}><span style={{fontSize:12,fontWeight:700,color:"#f87171"}}>⚠ {T("carryover",lang)} ({Object.entries(carry).map(([k,v])=>SM.find(s=>s.key===k).icon+" "+v).join(", ")})</span></div>}
      {surplus>0&&<div style={{background:"rgba(39,174,96,0.08)",border:"1px solid rgba(39,174,96,0.2)",borderRadius:8,padding:"8px 14px",marginBottom:10,textAlign:"center"}}><span style={{fontSize:12,fontWeight:700,color:"#16a34a"}}>💰 {T("surplus",lang)}: +{surplus} {surplus===1?T("point",lang):T("points",lang)}</span></div>}
      <div style={{marginBottom:8}}>{SM.map(s=><SB key={s.key} label={lang==="es"?s.labelEs:s.label} value={sc[s.key]} color={s.color} icon={s.icon} hc={hc}/>)}</div>
      <OpinionBar value={opinion} hc={hc} label={T("opinion",lang)}/>
      <div className="fact-card" style={{color:t.m}}>📊 {fact}</div>
      {al.policy>=2&&<div style={{background:hc?"rgba(123,78,163,0.08)":"rgba(123,78,163,0.12)",border:"1px solid "+(hc?"#b8b":"rgba(123,78,163,0.25)"),borderRadius:8,padding:"8px 14px",marginBottom:10,textAlign:"center"}}><span style={{fontSize:12,fontWeight:700,color:"#9b6ec4"}}>📋 {T("trustActive",lang)}</span></div>}
      <div style={{background:rem===0?"rgba(39,174,96,0.1)":t.abg,border:"1px solid "+(rem===0?(hc?"#2a9d4a":"rgba(39,174,96,0.3)"):(hc?"#ddb":"rgba(212,160,23,0.3)")),borderRadius:8,padding:"9px 14px",marginBottom:14,textAlign:"center"}}><span style={{fontSize:13,fontWeight:700,color:rem===0?"#16a34a":t.acc}}>{rem===0?"✓ "+T("allocated",lang):rem+" "+(rem!==1?T("points",lang):T("point",lang))+" "+T("remaining",lang)}</span></div>
      {DEPTS.map((d,i)=>(
        <div key={d.id} className="dept-card" style={cd(al[d.id]>0,d.bg)}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}><span style={{fontSize:16}}>{d.icon}</span><span style={{fontSize:14,fontWeight:700,color:t.tx}}>{lang==="es"?d.nameEs:d.name}</span><span style={{fontSize:10,color:t.f,marginLeft:4,opacity:0.5}}>{i+1}</span></div>
              <p style={{fontSize:11,color:t.m,margin:0,lineHeight:1.4}}>{lang==="es"?d.descEs:d.desc}</p>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginLeft:14}}>
              <button className="alloc-btn" onClick={()=>adj(d.id,-1)} disabled={al[d.id]<=0} aria-label={"- "+d.name} style={{border:"2px solid "+d.bg,background:"transparent",color:d.bg}}>−</button>
              <span style={{fontSize:26,fontWeight:900,minWidth:30,textAlign:"center",color:al[d.id]>0?d.bg:t.f,transition:"color 0.2s"}}>{al[d.id]}</span>
              <button className="alloc-btn" onClick={()=>adj(d.id,1)} disabled={rem<=0} aria-label={"+ "+d.name} style={{border:"2px solid "+d.bg,background:rem<=0?"transparent":d.bg,color:rem<=0?d.bg:"#fff"}}>+</button>
            </div>
          </div>
        </div>
      ))}
      <Btn onClick={confirm} disabled={spent===0} style={{width:"100%",marginTop:8}}>{spent===0?T("allocMin",lang):T("confirm",lang)+" "+rnd+" "+T("budget",lang)}</Btn>
      <p className="kb-hint">1-6 allocate · Shift+key remove · Enter confirm</p>
    </div></div>
  );

  /* ── EVENT ── */
  if(ph==="event"&&ce&&er){
    const isGood=!!ce.bon;const voices=VO[ce.id]||[];
    return(<div style={shell} className={(hc?"hc ":"")+(shaking?"shake-it":"")}><div style={bar}><Logo hc={hc}/><div style={{display:"flex",alignItems:"center",gap:6}}>{headerBtns}<span style={{fontWeight:700,fontSize:12,color:"#1a1a2e",opacity:0.7,marginLeft:4}}>{T("year",lang)} {rnd}</span></div></div>
    <Prog round={rnd} total={ROUNDS}/>
    <div key={"e"+rnd} className="phase" style={{padding:"20px 20px 24px"}} role="region" aria-live="polite">
      <div style={{textAlign:"center",marginBottom:8}}><span className="breaking">{isGood?T("opportunity",lang):T("breaking",lang)}</span></div>
      <div style={{textAlign:"center",marginBottom:14}}><span style={{fontSize:52}}>{ce.icon}</span></div>
      <h2 className="newsflash" style={{fontSize:19,fontWeight:800,textAlign:"center",margin:"0 0 4px",color:isGood?(hc?"#16a34a":"#4ade80"):(hc?"#dc2626":"#f87171")}}>{lang==="es"?ce.titleEs:ce.title}</h2>
      {ce.hood&&<p style={{fontSize:11,textAlign:"center",color:t.acc,fontWeight:600,marginBottom:8}}>📍 {ce.hood}</p>}
      <p style={{fontSize:13,lineHeight:1.65,textAlign:"center",color:t.m,marginBottom:18}}>{ce.desc}</p>
      <div className="stamp" style={{background:er.mit?(hc?"rgba(22,163,74,0.08)":"rgba(74,222,128,0.07)"):(hc?"rgba(220,38,38,0.08)":"rgba(248,113,113,0.07)"),border:"1px solid "+(er.mit?(hc?"#4a9":"rgba(74,222,128,0.2)"):(hc?"#d66":"rgba(248,113,113,0.2)")),borderRadius:12,padding:16,marginBottom:16,textAlign:"center"}}>
        <p style={{fontSize:14,fontWeight:700,margin:"0 0 6px",color:er.mit?(hc?"#16a34a":"#4ade80"):(hc?"#dc2626":"#f87171")}}>{"✓ "+T(er.mit?"paidOff":"unprepared",lang)}</p>
        <p style={{fontSize:13,color:t.m,margin:0,lineHeight:1.55}}>{er.msg}</p>
        {tb&&<p style={{fontSize:11,color:"#9b6ec4",margin:"8px 0 0",fontWeight:600}}>📋 {T("trustActive",lang)}</p>}
      </div>
      {md&&<a href={md.url} target="_blank" rel="noopener noreferrer" className="tool-link" style={{background:md.bg+(hc?"15":"0d"),border:"1px solid "+md.bg+(hc?"40":"28"),marginBottom:16}}><span style={{fontSize:22}}>{md.icon}</span><div style={{flex:1}}><span style={{fontSize:12,fontWeight:700,color:md.bg}}>{T("explore",lang).split(" ")[0]}: {md.tool} ↗</span><p style={{fontSize:11,color:t.m,margin:"3px 0 0",lineHeight:1.35}}>{ce.tn}</p></div></a>}
      <div style={{background:hc?"#faf5ea":"rgba(212,160,23,0.05)",border:"1px solid "+(hc?"#e0d0a0":"rgba(212,160,23,0.12)"),borderRadius:10,padding:"12px 14px",marginBottom:16}}>
        <p style={{fontSize:11,fontWeight:700,color:t.acc,margin:"0 0 4px"}}>{T("govInsight",lang)}</p>
        <p style={{fontSize:11.5,color:t.m,margin:0,lineHeight:1.55,fontStyle:"italic"}}>{ce.gi}</p>
      </div>
      {voices.length>0&&<div style={{marginBottom:16}}>
        <p style={{fontSize:11,fontWeight:700,color:t.f,marginBottom:8,letterSpacing:0.5}}>{T("communityVoices",lang)}</p>
        {voices.map((v,i)=><VC key={i} rk={v.r} text={er.mit?v.y:v.n} hc={hc} cont={getCont(v.r)}/>)}
      </div>}
      <div style={{marginBottom:8}}><p style={{fontSize:11,fontWeight:700,color:t.f,marginBottom:8,letterSpacing:0.5}}>{T("scoreUpdate",lang)}</p>{SM.map(s=>{const d=er.after[s.key]-(prev||sc)[s.key];return <SB key={s.key} label={lang==="es"?s.labelEs:s.label} value={er.after[s.key]} color={s.color} icon={s.icon} delta={d} hc={hc}/>})}</div>
      <OpinionBar value={opinion} hc={hc} label={T("opinion",lang)}/>
      <Btn onClick={resolve} style={{width:"100%",marginTop:8}}>{rnd>=ROUNDS?T("seeReport",lang):T("beginNext",lang)+" "+(rnd+1)+" →"}</Btn>
    </div></div>);
  }

  /* ── GAME OVER ── */
  if(ph==="over"){
    const strongest=[...SM].sort((a,b)=>sc[b.key]-sc[a.key])[0];
    const weakest=[...SM].sort((a,b)=>sc[a.key]-sc[b.key])[0];
    const topD=[...DEPTS].sort((a,b)=>(totals[b.id]||0)-(totals[a.id]||0))[0];
    return(<div style={shell} className={hc?"hc":""}>{grade.g==="A"&&<Confetti/>}<div style={bar}><Logo hc={hc}/>{headerBtns}</div>
    <div key="over" className="phase" style={{background:hc?t.bg:t.grad,padding:"24px 20px",minHeight:"90vh"}}>
      <div style={{textAlign:"center",marginBottom:22}}>
        <p style={{fontSize:11,color:t.acc,letterSpacing:3,fontWeight:600,marginBottom:14}}>{T("govReport",lang)}</p>
        <div className="grade-circle" style={{width:90,height:90,borderRadius:"50%",margin:"0 auto 12px",display:"flex",alignItems:"center",justifyContent:"center",background:grade.g<="B"?"linear-gradient(135deg,#D4A017,#f4d03f)":grade.g==="C"?"linear-gradient(135deg,#f39c12,#fbbf24)":"linear-gradient(135deg,#c0392b,#f87171)",fontSize:44,fontWeight:900,color:"#1a1a2e",boxShadow:"0 4px 20px rgba(212,160,23,0.3)"}}>{grade.g}</div>
        <h2 style={{fontSize:22,fontWeight:800,margin:"0 0 6px",color:t.tx}}>{lang==="es"?grade.tEs:grade.t}</h2>
        <p style={{fontSize:13,color:t.m,margin:"0 0 4px",lineHeight:1.55}}>{lang==="es"?grade.mEs:grade.m}</p>
        <p style={{fontSize:12,color:t.f,margin:0}}>Average: {avg}/100 · {T("difficulty",lang)}: {T(diff,lang)}</p>
      </div>
      {/* Epilogue */}
      <div style={{background:t.abg,border:"1px solid "+(hc?"#ddb":"rgba(212,160,23,0.18)"),borderRadius:12,padding:16,marginBottom:16}}>
        <p style={{fontSize:11,fontWeight:700,color:t.acc,letterSpacing:1,marginBottom:6}}>{T("epilogue",lang)}</p>
        <p style={{fontSize:13,color:t.m,margin:0,lineHeight:1.65,fontStyle:"italic"}}>{epilogue}</p>
      </div>
      {/* Gov Style */}
      <div style={{background:t.abg,border:"1px solid "+(hc?"#ddb":"rgba(212,160,23,0.18)"),borderRadius:12,padding:16,marginBottom:16}}>
        <p style={{fontSize:12,fontWeight:700,color:t.acc,margin:"0 0 4px"}}>{T("govStyle",lang)}</p>
        <p style={{fontSize:16,fontWeight:800,color:t.tx,margin:"0 0 6px"}}>{lang==="es"?gSt.tEs:gSt.t}</p>
        <p style={{fontSize:12.5,color:t.m,margin:0,lineHeight:1.55}}>{gSt.d}</p>
        <p style={{fontSize:11,color:t.f,margin:"10px 0 0"}}>Top: {topD.icon} {lang==="es"?topD.nameEs:topD.name} · Best: {strongest.icon} · Weakest: {weakest.icon}</p>
      </div>
      {/* Disability */}
      <div style={{background:hc?"rgba(100,100,200,0.05)":"rgba(100,100,255,0.05)",border:"1px solid "+(hc?"#aab":"rgba(100,100,255,0.12)"),borderRadius:12,padding:16,marginBottom:16}}>
        <p style={{fontSize:12,fontWeight:700,color:"#818cf8",margin:"0 0 4px"}}>♿ {T("disAssess",lang)}</p>
        <p style={{fontSize:15,fontWeight:800,color:disA.c,margin:"0 0 8px"}}>{lang==="es"?disA.tEs:disA.t}</p>
        <div className="voice-card" style={{background:hc?"#f0f0f0":"rgba(255,255,255,0.04)",border:hc?"1px solid #bbb":"1px solid rgba(255,255,255,0.06)"}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}><span style={{fontSize:18}}>♿</span><span style={{fontSize:12,fontWeight:700,color:hc?"#111":"#d0c8b8"}}>Maya Chen</span><span style={{fontSize:11,color:hc?"#555":"#778",marginLeft:4}}>34 · West Philadelphia</span></div><p style={{fontSize:12.5,color:hc?"#333":"#a8a098",margin:0,lineHeight:1.55,fontStyle:"italic"}}>"{disA.q}"</p></div>
      </div>
      {/* Achievements */}
      {unlockedAchs.length>0&&<div style={{marginBottom:16}}>
        <p style={{fontSize:11,fontWeight:700,color:t.acc,letterSpacing:1,marginBottom:8}}>{T("achievements",lang)}</p>
        <div style={{display:"flex",flexWrap:"wrap"}}>{unlockedAchs.map((id,i)=>{const a=ACHS.find(x=>x.id===id);return a?<div key={id} className="achieve-badge" style={{animationDelay:i*0.15+"s",color:t.m}}><span style={{fontSize:16}}>{a.icon}</span><div><div style={{fontWeight:700,color:t.tx,fontSize:12}}>{a.n}</div><div style={{fontSize:10,color:t.f}}>{a.d}</div></div></div>:null})}</div>
      </div>}
      {/* Scores */}
      <div style={{marginBottom:8}}>{SM.map(s=><SB key={s.key} label={lang==="es"?s.labelEs:s.label} value={sc[s.key]} color={s.color} icon={s.icon} hc={hc}/>)}</div>
      <OpinionBar value={opinion} hc={hc} label={T("opinion",lang)}/>
      <div style={{background:t.cg,border:"1px solid "+t.cb,borderRadius:12,padding:"14px 10px 6px",marginBottom:16}}><p style={{fontSize:11,fontWeight:700,color:t.f,margin:"0 0 8px 6px",letterSpacing:0.5}}>{T("scoreEvo",lang)}</p><ScoreChart data={sh} t={t} lang={lang}/></div>
      {/* Tools */}
      <div style={{marginBottom:16}}>
        <p style={{fontSize:12,fontWeight:700,color:t.acc,marginBottom:10}}>{T("explore",lang)}</p>
        {DEPTS.map(d=><a key={d.id} href={d.url} target="_blank" rel="noopener noreferrer" className="tool-link" style={{background:t.cg,border:"1px solid "+t.cb}}><span style={{fontSize:18}}>{d.icon}</span><span style={{fontSize:12.5,fontWeight:700,color:d.bg}}>{d.tool}</span><span style={{fontSize:11,color:t.f,marginLeft:"auto"}}>↗</span></a>)}
        {XT.map(x=><a key={x.n} href={x.u} target="_blank" rel="noopener noreferrer" className="tool-link" style={{background:t.cg,border:"1px solid "+t.cb}}><span style={{fontSize:18}}>🔧</span><span style={{fontSize:12,fontWeight:600,color:t.m}}>{x.n}</span><span style={{fontSize:11,color:t.f,marginLeft:"auto"}}>↗</span></a>)}
      </div>
      {/* What Can I Do */}
      <div style={{marginBottom:16}}>
        <p style={{fontSize:12,fontWeight:700,color:t.acc,marginBottom:10}}>{T("whatCanIDo",lang)}</p>
        {CIVIC.map(c=><a key={c.t} href={c.u} target="_blank" rel="noopener noreferrer" className="tool-link" style={{background:t.cg,border:"1px solid "+t.cb}}><span style={{fontSize:14}}>→</span><div><span style={{fontSize:12,fontWeight:700,color:t.tx}}>{c.t}</span><p style={{fontSize:11,color:t.m,margin:"2px 0 0"}}>{c.d}</p></div></a>)}
      </div>
      {/* Readings */}
      <div style={{marginBottom:16}}>
        <p style={{fontSize:12,fontWeight:700,color:t.acc,marginBottom:10}}>{T("readings",lang)}</p>
        {READINGS.map(r=><a key={r.t} href={r.u} target="_blank" rel="noopener noreferrer" className="tool-link" style={{background:t.cg,border:"1px solid "+t.cb}}><div><span style={{fontSize:12,fontWeight:700,color:t.tx}}>{r.t}</span><p style={{fontSize:10,color:t.f,margin:"2px 0 0"}}>{r.s}</p></div><span style={{fontSize:11,color:t.f,marginLeft:"auto"}}>↗</span></a>)}
      </div>
      {/* QR + Scan */}
      <div style={{textAlign:"center",marginBottom:16}}>
        <p style={{fontSize:11,fontWeight:700,color:t.f,letterSpacing:0.5,marginBottom:6}}>{T("scanToPlay",lang)}</p>
        <QR/><p style={{fontSize:10,color:t.f}}>meyeringn.github.io/sim-philly-2000</p>
      </div>
      {/* Leaderboard */}
      {lb.length>0&&<div style={{background:t.cg,border:"1px solid "+t.cb,borderRadius:10,padding:"12px 14px",marginBottom:16}}>
        <p style={{fontSize:11,fontWeight:700,color:t.f,margin:"0 0 8px"}}>{T("leaderboard",lang)}</p>
        {lb.map((s,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,color:t.m,padding:"4px 0",borderBottom:"1px solid "+t.cb}}><span>{i+1}. {s.sty}</span><span style={{fontWeight:700,color:t.acc}}>{s.g} ({s.avg})</span></div>)}
      </div>}
      {/* Data Sources */}
      <div style={{background:t.cg,border:"1px solid "+t.cb,borderRadius:10,padding:"12px 14px",marginBottom:16}}>
        <p style={{fontSize:11,fontWeight:700,color:t.f,margin:"0 0 6px"}}>{T("dataSources",lang)}</p>
        <p style={{fontSize:10.5,color:t.m,margin:0,lineHeight:1.65}}>Pew, "Philadelphia 2026" · Brookings, "SE PA Market Assessment" · Pew, "Gen Z Likes Philadelphia" · Pew, "Guiding Document at 75" · Opportunity Insights</p>
      </div>
      {/* Action buttons */}
      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <Btn onClick={share} style={{flex:1,fontSize:13,background:cp?"#16a34a":"#D4A017"}}>{cp?"✓ "+T("copied",lang):"📋 "+T("share",lang)}</Btn>
        <a href={tweetUrl} target="_blank" rel="noopener noreferrer" className="btn" style={{flex:1,fontSize:13,textAlign:"center",textDecoration:"none",display:"flex",alignItems:"center",justifyContent:"center"}}>𝕏 Tweet</a>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <Btn onClick={()=>genImg(grade,sc,gSt,disA,avg)} style={{flex:1,fontSize:12,background:"transparent",border:"1px solid "+t.acc,color:t.acc}}>📸 {T("downloadImg",lang)}</Btn>
        <Btn onClick={()=>printReport(grade,sc,gSt,disA,avg,lang)} style={{flex:1,fontSize:12,background:"transparent",border:"1px solid "+t.acc,color:t.acc}}>🖨 {T("printReport",lang)}</Btn>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <Btn onClick={()=>{navigator.clipboard.writeText(challengeUrl);alert(lang==="es"?"¡Enlace copiado!":"Challenge link copied!")}} style={{flex:1,fontSize:12,background:"transparent",border:"1px solid "+t.acc,color:t.acc}}>🔗 {T("challengeFriend",lang)}</Btn>
        <Btn onClick={()=>setShowEmbed(!showEmbed)} style={{flex:1,fontSize:12,background:"transparent",border:"1px solid "+t.acc,color:t.acc}}>{"</>"} {T("embedCode",lang)}</Btn>
      </div>
      {showEmbed&&<div style={{background:t.cg,border:"1px solid "+t.cb,borderRadius:8,padding:12,marginBottom:16}}>
        <p style={{fontSize:11,fontWeight:700,color:t.f,margin:"0 0 6px"}}>Embed code:</p>
        <textarea readOnly value={embedCode} style={{width:"100%",height:60,background:t.bg,color:t.acc,border:"1px solid "+t.cb,borderRadius:6,padding:8,fontSize:11,fontFamily:"monospace",resize:"none"}} onClick={e=>e.target.select()}/>
      </div>}
      {/* Credits */}
      <div style={{background:t.abg,border:"1px solid "+(hc?"#ddb":"rgba(212,160,23,0.12)"),borderRadius:12,padding:16,marginBottom:16,textAlign:"center"}}>
        <p style={{fontSize:12.5,color:t.m,margin:0,lineHeight:1.7}}>Built by <strong style={{color:t.acc}}>Nico Meyering, MPA</strong><br/><span style={{fontSize:11,color:t.f}}>Chairman, Mayor's Commission on People with Disabilities<br/>VP, Net Impact Philly · Board, Disability Pride PA<br/>Steering Committee, Transit Forward Philadelphia</span></p>
      </div>
      <Btn onClick={start} style={{width:"100%"}}>{T("playAgain",lang)}</Btn>
    </div></div>);
  }
  return null;
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
