<style>

d{color:var(--muted)}.small{font-size:.84rem}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#111c32;color:var(--muted);padding:7px 10px;border-radius:999px;font-size:.82rem}.chip strong{color:var(--ink)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0 20px}.step{height:8px;border-radius:9px;background:#293752}.step.on{background:var(--gold)}.scoregrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.score{background:#111c32;border:1px solid var(--line);border-radius:12px;padding:12px}.scoretop{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;font-weight:750}.meter{height:9px;background:#283651;border-radius:9px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:var(--gold);border-radius:9px}.budget{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#0f1a30;border:1px solid var(--line);margin:14px 0}.budget strong{font-size:1.35rem;color:var(--gold)}.dept{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding:15px 0}.dept:first-of-type{border-top:0}.deptname{font-weight:850}.controls{display:flex;align-items:center;gap:9px}.round{width:42px;height:42px;border-radius:50%;border:1px solid #52617c;background:#111c32;color:var(--ink);font-size:1.25rem}.num{min-width:28px;text-align:center;font-size:1.35rem;font-weight:950}.news{border-left:5px solid var(--gold)}.eyebrow{font-size:.72rem;font-weight:900;letter-spacing:.15em;color:var(--gold);text-transform:uppercase}.result.good{border-color:#397e51}.result.bad{border-color:#87484f}.callout{padding:12px;border-radius:10px;background:#101b30;border:1px solid var(--line);margin:12px 0}.controltag{display:inline-block;margin-top:6px;padding:5px 8px;border-radius:7px;background:#263653;color:#d8e1ef;font-size:.78rem}.quote{font-style:italic;color:#d7dce5;border-left:3px solid #667897;padding-left:12px}.grade{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;margin:12px auto;background:var(--gold);color:#111827;font-size:3rem;font-weight:950}.leader{width:100%;border-collapse:collapse}.leader td,.leader th{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem}.leader th:last-child,.leader td:last-child{text-align:right}.links a{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}.footer{text-align:center;color:#73809a;font-size:.78rem;padding:24px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:10px;font-weight:750;z-index:50}.hc{--bg:#fff;--panel:#fff;--panel2:#f5f5f5;--ink:#000;--muted:#333;--line:#777;--gold:#9a6500}.hc body,.hc .app{background:#fff}.hc .top{background:#fff}.hc .score,.hc .budget,.hc .chip,.hc .round,.hc .callout{background:#fff}.hc a{color:#003e9c}@media(max-width:520px){main{padding-inline:14px}.hero{padding-top:40px}.scoregrid{grid-template-columns:1fr}.dept{grid-template-columns:1fr}.controls{justify-content:flex-end}.row .btn{flex:1}.top{padding-inline:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}@media print{.top,.no-print{display:none!important}.app{max-width:none;box-shadow:none}.card{break-inside:avoid;color:#000;background:#fff;border:1px solid #aaa}body{background:#fff;color:#000}.muted{color:#333}}
</style></head><body><div class="app" id="app"><header class="top"><div class="brand"><b>SIM</b>PHILLY 2000</div><div class="tools"><button class="iconbtn" id="sound" aria-label="Toggle sound">🔊</button><button class="iconbtn" id="contrast" aria-label="Toggle high contrast">◐</button></div></header><main id="screen"></main><div class="footer">A civic learning game. Scenarios are fictional unless explicitly labeled as a fact.</div></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const DEPTS=[
{id:'parks',icon:'🌳',name:'Parks & Canopy',desc:'Cool blocks, expand shade and improve public space.',imp:{equity:1.2,resilience:.7,carbon:1.1,health:2.1},access:1,control:'City government has major influence through Parks & Recreation, streets, planning and partnerships.'},
{id:'transit',icon:'🚇',name:'Transit & Mobility',desc:'Improve access to jobs while cutting transportation emissions.',imp:{equity:1.5,resilience:.4,carbon:2.2,health:.8},access:2,control:'SEPTA, not the mayor, operates regional transit. City Hall can fund, coordinate, advocate and shape streets.'},
{id:'flood',icon:'🌊',name:'Flood Resilience',desc:'Prepare homes, streets and infrastructure for heavier rain.',imp:{equity:1,resilience:2.7,carbon:.2,health:.9},access:1,control:'Philadelphia Water Department and other agencies manage much of this work, with state and federal partners.'},
{id:'refuge',icon:'🏠',name:'Climate Refuge',desc:'Build accessible cooling, clean-air and emergency shelter networks.',imp:{equity:1.6,resilience:1.7,carbon:.2,health:2},access:3,control:'The City can coordinate emergency planning and facilities, but schools, nonprofits and property owners also matter.'},
{id:'people',icon:'👥',name:'Neighborhood Power',desc:'Put residents closest to the problem closer to the decisions.',imp:{equity:2.6,resilience:.6,carbon:.4,health:1.2},access:2,control:'The mayor can fund engagement and programs. Council, RCOs, agencies, nonprofits and residents hold independent power too.'},
{id:'policy',icon:'📋',name:'Policy & Plain Language',desc:'Make policy understandable, usable and easier to implement.',imp:{equity:1,resilience:.9,carbon:1.1,health:.8},access:2,control:'The mayor proposes policy and runs executive agencies. City Council legislates and controls its own votes.'}
];
const SCENARIOS=[
{id:'heat',icon:'🔥',title:'Scenario: Five-Day Heat Emergency',dept:'parks',place:'Hunting Park',text:'A severe heat wave settles over Philadelphia. Blocks with less shade face the greatest heat exposure, and residents who rely on powered medical equipment need dependable cooling and electricity.',good:'Tree, shade and cooling investments reduce exposure while outreach teams prioritize residents at greatest risk.',bad:'Cooling resources arrive unevenly. Residents on hotter blocks have fewer ways to escape dangerous indoor temperatures.',damage:{health:-10,equity:-6},fact:'Philadelphia neighborhoods experience unequal heat exposure, and tree canopy is one tool cities use to reduce it.'},
{id:'storm',icon:'🌧️',title:'Scenario: Extreme Rain Floods Low-Lying Blocks',dept:'flood',place:'Eastwick',text:'A slow-moving storm overwhelms drainage in flood-prone areas. Basement flooding and road closures isolate residents.',good:'Earlier resilience investments limit damage and speed recovery.',bad:'Repeated flooding damages homes and deepens financial stress for households least able to absorb it.',damage:{resilience:-12,equity:-5},fact:'Eastwick has a long documented history of flooding and flood-risk concerns.'},
{id:'service',icon:'🚌',title:'Scenario: Transit Funding Squeeze',dept:'transit',place:'Citywide',text:'A regional funding gap forces difficult service choices. Riders warn that fewer trips would make work, school and health care harder to reach.',good:'Your mobility investments give City Hall stronger data, street improvements and funding partnerships to support service.',bad:'The city has few tools ready when riders need alternatives most.',damage:{equity:-8,carbon:-7},fact:'SEPTA is an independent regional authority. Philadelphia is an important partner, but the mayor does not unilaterally set SEPTA service.'},
{id:'smoke',icon:'😷',title:'Scenario: Hazardous Smoke Day',dept:'refuge',place:'North Philadelphia',text:'Wildfire smoke pushes air quality into dangerous territory. Residents need clean indoor air, clear alerts and accessible places to go.',good:'A network of accessible clean-air sites opens quickly with charging, seating and multilingual information.',bad:'Some residents discover that the nearest safe site is difficult to reach or use.',damage:{health:-10,equity:-6},fact:'Smoke events can create serious public-health risks, especially for people with respiratory and other health vulnerabilities.'},
{id:'grant',icon:'💵',title:'Scenario: Competitive Federal Resilience Grant',dept:'policy',place:'City Hall',text:'A fictional federal grant offers major funding to cities that can show a clear, measurable and publicly understandable resilience plan.',good:'Your plain-language planning and measurable goals make Philadelphia highly competitive.',bad:'The application has projects, but the public case and implementation plan are hard to follow.',bonus:{equity:6,resilience:5,carbon:3,health:3},fact:'Federal grants often require local governments to document needs, plans, outcomes and partnerships.'},
{id:'jobs',icon:'⚡',title:'Scenario: Clean-Energy Employer Site Search',dept:'people',place:'Philadelphia',text:'A fictional clean-energy manufacturer considers a Philadelphia facility. Community groups want jobs with accessible hiring, training and family-sustaining career paths.',good:'Workforce and neighborhood partnerships are ready before the deal is announced.',bad:'The proposal advances without a strong pipeline connecting nearby residents to the jobs.',bonus:{equity:7,carbon:4,health:2},fact:'Workforce access, transportation and skills pipelines shape whether economic growth reaches local residents.'},
{id:'access',icon:'♿',title:'Scenario: Citywide Emergency Accessibility Audit',dept:'refuge',place:'Citywide',text:'A disability coalition audits emergency sites and finds inconsistent physical access, charging options, communication access and wayfinding.',good:'Your refuge network was designed with disabled residents from the start, so fixes are targeted rather than improvised.',bad:'The city discovers that a shelter is not truly useful if people cannot enter it, communicate there or power essential equipment.',damage:{equity:-9,health:-5},fact:'Accessible emergency planning includes more than ramps. Communication, transportation, power and usable facilities all matter.'},
{id:'housing',icon:'🏘️',title:'Scenario: Climate Investment Raises Displacement Fears',dept:'people',place:'Several neighborhoods',text:'New green infrastructure makes blocks healthier and more desirable. Residents ask whether they will still be able to afford to live there.',good:'Community power funding pairs environmental investment with resident protections and local decision-making.',bad:'The city improves places without doing enough to protect the people already living there.',damage:{equity:-10,health:-3},fact:'Public investment can create benefits while also raising concerns about displacement and who captures neighborhood gains.'}
];
const FACTS=['Pew reported roughly 274,000 Philadelphians with disabilities using 2019–2023 five-year Census data.','SEPTA described itself in September 2026 as serving more than 800,000 daily riders.','SEPTA reported 697,340 average daily unlinked trips in August 2026.','Philadelphia’s poverty rate fell below 20% in Pew’s 2026 State of the City report.'];
const SOURCES=[['Pew: Philadelphia 2026','https://www.pew.org/en/research-and-analysis/reports/2026/04/philadelphia-2026'],['Pew: Philadelphians With Disabilities','https://www.pew.org/en/research-and-analysis/fact-sheets/2025/12/philadelphians-with-disabilities-increasingly-are-finding-employment'],['SEPTA: Accelerate','https://wwww.septa.org/accelerate/'],['SEPTA: August 2026 Ridership','https://wwww.septa.org/news/ridership-august-2026/']];
const init={equity:35,resilience:32,carbon:28,health:40}; let state={view:'home',year:1,diff:'normal',scores:{...init},alloc:{},history:[],events:[],trust:50,muted:false};
const $=s=>document.querySelector(s), clamp=n=>Math.max(0,Math.min(100,n));
function tone(){if(state.muted)return;try{let c=new (AudioContext||webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=620;g.gain.value=.025;o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.08);o.stop(c.currentTime+.08)}catch(e){}}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function budget(){return state.diff==='easy'?14:state.diff==='hard'?10:12} function spent(){return Object.values(state.alloc).reduce((a,b)=>a+b,0)}
function header(title,sub=''){return `<div class="kicker">Year ${state.year} of 4</div><h1 style="font-size:2rem;margin:.3rem 0">${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}<div class="steps">${[1,2,3,4].map(x=>`<i class="step ${x<=state.year?'on':''}"></i>`).join('')}</div>`}
function scores(){let names={equity:'⚖️ Equity',resilience:'🛡️ Resilience',carbon:'🌱 Carbon',health:'❤️ Health'};return `<div class="scoregrid">${Object.keys(names).map(k=>`<div class="score"><div class="scoretop"><span>${names[k]}</span><span>${Math.round(state.scores[k])}</span></div><div class="meter"><i style="width:${state.scores[k]}%"></i></div></div>`).join('')}</div>`}
function render(){let s=$('#screen'); if(state.view==='home')s.innerHTML=`<section class="hero"><div class="kicker">Philadelphia civic strategy game</div><h1>SIM<span>PHILLY</span><br>2000</h1><p class="lede">Four years. Six priorities. A city full of tradeoffs. Build a Philadelphia that can handle climate shocks without leaving people behind.</p><div class="row"><button class="btn" data-act="setup">Start a new term</button><button class="btn secondary" data-act="how">How to play</button></div><div class="card" style="text-align:left;margin-top:34px"><strong>Built for comparison, not political prediction.</strong><p class="muted small">You play the mayor, but the game tells you when power actually belongs to SEPTA, City Council, another agency, residents, or another level of government. News-style events are labeled as fictional scenarios.</p></div>${leaderboard()}`;
else if(state.view==='how')s.innerHTML=`<section>${header('How to play','A run takes about 5–8 minutes.')}<div class="card"><h2>1. Set a budget</h2><p>Each year, put points into six civic priorities. You can concentrate resources or spread them around.</p><h2>2. Face a scenario</h2><p>A fictional Philadelphia challenge tests one priority. Investing at least 2 points prepares that system. Your other investments still improve long-term scores.</p><h2>3. Learn who controls what</h2><p>The mayor fantasy stays fun, but every department includes a quick “Who actually controls this?” note.</p><h2>4. Compare results</h2><p>Your final report includes a grade, governance style, disability-access score and a compact result code you can compare with friends.</p></div><button class="btn" data-act="setup">Choose difficulty</button></section>`;
else if(state.view==='setup')s.innerHTML=`<section>${header('Choose your difficulty','This changes how many budget points you receive each year.')}<div class="card">${[['easy','Easy','14 points/year'],['normal','Normal','12 points/year'],['hard','Hard','10 points/year']].map(d=>`<button class="btn ${state.diff===d[0]?'':'secondary'}" style="width:100%;margin:5px 0" data-diff="${d[0]}">${d[1]} · ${d[2]}</button>`).join('')}</div><div class="card"><strong>Starting conditions</strong><p class="muted small">These are game values, not a government rating. They create room for improvement and tradeoffs.</p>${scores()}</div><button class="btn" data-act="begin">Begin Year 1</button></section>`;
else if(state.view==='alloc')s.innerHTML=`<section>${header('Build your budget','Every point helps long-term outcomes. Two points in a department prepares it for a matching crisis.')} ${scores()}<div class="budget"><span>Points remaining</span><strong>${budget()-spent()}</strong></div><div class="card">${DEPTS.map(d=>`<div class="dept"><div><div class="deptname">${d.icon} ${d.name}</div><div class="muted small">${d.desc}</div><div class="controltag">Who controls this? Tap info</div><button class="iconbtn" style="min-height:32px;margin-top:7px" data-info="${d.id}">i</button></div><div class="controls"><button class="round" aria-label="Remove from ${d.name}" data-minus="${d.id}">−</button><span class="num">${state.alloc[d.id]||0}</span><button class="round" aria-label="Add to ${d.name}" data-plus="${d.id}">+</button></div></div>`).join('')}</div><div class="card"><strong>Philadelphia reality check</strong><p class="muted small">${FACTS[(state.year-1)%FACTS.length]}</p></div><button class="btn" style="width:100%" data-act="confirm" ${spent()===0?'disabled':''}>Lock in Year ${state.year}</button></section>`;
else if(state.view==='event'){let e=state.current,r=state.result,d=DEPTS.find(x=>x.id===e.dept);s.innerHTML=`<section>${header('Your budget meets reality')}<div class="card news"><div class="eyebrow">Fictional scenario · ${e.place}</div><div style="font-size:3rem">${e.icon}</div><h2>${e.title}</h2><p>${e.text}</p><div class="callout"><strong>Who actually controls this?</strong><div class="muted small">${d.control}</div></div></div><div class="card result ${r.ok?'good':'bad'}"><div class="eyebrow">${r.ok?'Prepared':'Underprepared'}</div><h2>${r.ok?'Your investment pays off':'The gap shows up'}</h2><p>${r.ok?e.good:e.bad}</p><p class="quote">${e.fact}</p></div>${scores()}<div class="card"><strong>Public trust</strong><div class="meter"><i style="width:${state.trust}%;background:var(--purple)"></i></div><p class="small muted">${Math.round(state.trust)}/100. Trust is a game mechanic representing whether residents see your administration as prepared and responsive.</p></div><button class="btn" style="width:100%" data-act="next">${state.year===4?'See final report':'Continue to Year '+(state.year+1)}</button></section>`}
else if(state.view==='over'){let avg=Math.round(Object.values(state.scores).reduce((a,b)=>a+b)/4),grade=avg>=80?'A':avg>=68?'B':avg>=55?'C':avg>=42?'D':'F',tot={};DEPTS.forEach(d=>tot[d.id]=state.history.reduce((a,h)=>a+(h.alloc[d.id]||0),0));let top=DEPTS.sort? [...DEPTS].sort((a,b)=>tot[b.id]-tot[a.id])[0]:DEPTS[0],access=state.history.reduce((sum,h)=>sum+DEPTS.reduce((x,d)=>x+(h.alloc[d.id]||0)*d.access,0),0),accessLabel=access>=70?'Disability-forward planning':access>=42?'Accessibility is present, but uneven':'Accessibility was underfunded';let style=top.id==='people'?'Neighborhood Power Builder':top.id==='transit'?'Mobility Mayor':top.id==='policy'?'Systems Translator':top.id==='parks'?'Green Infrastructure Mayor':top.id==='refuge'?'Resilience Protector':'Infrastructure Builder';let code=`${grade}-${Math.round(state.scores.equity)}-${Math.round(state.scores.resilience)}-${Math.round(state.scores.carbon)}-${Math.round(state.scores.health)}`;saveScore({grade,avg,style,code});s.innerHTML=`<section><div class="kicker" style="text-align:center">Governance report</div><div class="grade">${grade}</div><h1 style="text-align:center;margin:.3rem 0">${style}</h1><p class="muted" style="text-align:center">Overall ${avg}/100 · ${state.diff} mode · ${state.history.filter(h=>h.ok).length}/4 scenarios prepared for</p><div class="card">${scores()}<h3 style="margin-top:18px">♿ ${accessLabel}</h3><p class="muted small">This game rewards planning that treats physical access, communication, transportation and emergency power as core infrastructure rather than add-ons.</p></div><div class="card"><h2>Your comparison code</h2><div style="font-size:1.5rem;font-weight:950;color:var(--gold)">${code}</div><p class="muted small">Share this with other players. The four numbers are Equity, Resilience, Carbon and Health.</p><div class="row no-print"><button class="btn" data-copy="${code}">Copy results</button><button class="btn secondary" onclick="window.print()">Print report</button></div></div>${leaderboard()}<div class="card links"><h2>Check the real-world sources</h2>${SOURCES.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${x[0]} ↗</a>`).join('')}<p class="muted small">The scenarios are fictional teaching devices. Real-world facts are separated from them and linked here so players can verify the context.</p></div><button class="btn" style="width:100%" data-act="restart">Play another term</button></section>`}
wire(); window.scrollTo(0,0)}
function leaderboard(){let l=JSON.parse(localStorage.getItem('sp2k-public-lb')||'[]');if(!l.length)return'';return `<div class="card"><h2>Local leaderboard</h2><p class="muted small">Saved only on this device.</p><table class="leader"><tr><th>Style</th><th>Result</th></tr>${l.slice(0,5).map(x=>`<tr><td>${x.style}</td><td>${x.grade} · ${x.avg}</td></tr>`).join('')}</table></div>`}
function saveScore(x){let l=JSON.parse(localStorage.getItem('sp2k-public-lb')||'[]');if(l.some(y=>y.code===x.code&&y.style===x.style))return;l.push(x);l.sort((a,b)=>b.avg-a.avg);localStorage.setItem('sp2k-public-lb',JSON.stringify(l.slice(0,5)))}
function start(){state.year=1;state.scores={...init};state.alloc={};state.history=[];state.events=shuffle(SCENARIOS).slice(0,4);state.trust=50;state.view='alloc';render()}
function confirm(){let e=state.events[state.year-1],d=DEPTS.find(x=>x.id===e.dept),ok=(state.alloc[e.dept]||0)>=2;for(let dep of DEPTS){let p=state.alloc[dep.id]||0;for(let k in dep.imp)state.scores[k]=clamp(state.scores[k]+p*dep.imp[k]*.55)}if(ok){if(e.bonus)for(let k in e.bonus)state.scores[k]=clamp(state.scores[k]+e.bonus[k]);if(e.damage)for(let k in e.damage)state.scores[k]=clamp(state.scores[k]+e.damage[k]*.25);state.trust=clamp(state.trust+7)}else{if(e.damage)for(let k in e.damage)state.scores[k]=clamp(state.scores[k]+e.damage[k]);if(e.bonus)for(let k in e.bonus)state.scores[k]=clamp(state.scores[k]+e.bonus[k]*.25);state.trust=clamp(state.trust-8)}state.current=e;state.result={ok};state.history.push({year:state.year,alloc:{...state.alloc},event:e.id,ok});state.view='event';tone();render()}
function toast(x){let t=$('#toast');t.textContent=x;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1500)}
function wire(){document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{tone();let a=b.dataset.act;if(a==='setup'){state.view='setup';render()}if(a==='how'){state.view='how';render()}if(a==='begin')start();if(a==='confirm')confirm();if(a==='next'){if(state.year===4){state.view='over'}else{state.year++;state.alloc={};state.view='alloc'}render()}if(a==='restart'){state.view='setup';render()}});document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{state.diff=b.dataset.diff;render()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{if(spent()<budget()){let k=b.dataset.plus;state.alloc[k]=(state.alloc[k]||0)+1;render()}});document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{let k=b.dataset.minus;if((state.alloc[k]||0)>0)state.alloc[k]--;render()});document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>{let d=DEPTS.find(x=>x.id===b.dataset.info);alert(d.name+'\n\n'+d.control)});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{let avg=Math.round(Object.values(state.scores).reduce((a,c)=>a+c)/4);let text=`I played SimPhilly 2000. Result: ${b.dataset.copy}, overall ${avg}/100. Can you build a more resilient Philadelphia?`;navigator.clipboard?.writeText(text).then(()=>toast('Results copied'))})}
$('#sound').onclick=()=>{state.muted=!state.muted;$('#sound').textContent=state.muted?'🔇':'🔊';toast(state.muted?'Sound off':'Sound on')};$('#contrast').onclick=()=>{document.documentElement.classList.toggle('hc');toast('Contrast changed')};render();
})();
</script></body></html>
