const SFX={ctx:null,muted:false,
  init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch{}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  play(type){if(this.muted||!this.ctx)return;try{const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.connect(g);g.connect(this.ctx.destination);
    if(type==='click'){o.frequency.value=660;g.gain.setValueAtTime(0.06,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);o.start(t);o.stop(t+0.08)}
    else if(type==='crisis'){o.type='sawtooth';o.frequency.setValueAtTime(250,t);o.frequency.exponentialRampToValueAtTime(80,t+0.6);g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.6);o.start(t);o.stop(t+0.6)}
    else if(type==='success'){o.frequency.value=523;g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);o.start(t);o.stop(t+0.25);const o2=this.ctx.createOscillator(),g2=this.ctx.createGain();o2.connect(g2);g2.connect(this.ctx.destination);o2.frequency.value=784;g2.gain.setValueAtTime(0.08,t+0.15);g2.gain.exponentialRampToValueAtTime(0.001,t+0.45);o2.start(t+0.15);o2.stop(t+0.45)}
    else if(type==='grade'){o.type='triangle';o.frequency.value=440;o.frequency.setValueAtTime(440,t);o.frequency.exponentialRampToValueAtTime(880,t+0.3);g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);o.start(t);o.stop(t+0.5)}
  }catch{}}};

/* ═══ LEADERBOARD ═══ */
function getLB(){try{return JSON.parse(localStorage.getItem('sp2k-lb')||'[]')}catch{return[]}}
function saveLB(g,avg,sty,dis){const lb=getLB();lb.push({g,avg,sty,dis,d:new Date().toLocaleDateString()});lb.sort((a,b)=>b.avg-a.avg);if(lb.length>5)lb.length=5;try{localStorage.setItem('sp2k-lb',JSON.stringify(lb))}catch{};return lb}

  w.document.write('<h1>SimPhilly 2000</h1><p style="color:#888;font-size:13px">Climate Equity Governance Report</p>');
  w.document.write('<div class="grade">'+grade.grade+'</div><h2>'+grade.title+'</h2><p>'+grade.msg+'</p><p style="color:#888">Average Score: '+avg+'/100</p>');
  w.document.write('<h2>Governance Style: '+gStyle.title+'</h2><p>'+gStyle.desc+'</p>');
  w.document.write('<h2>Final Scores</h2><div class="row"><span>⚖️ Equity</span><span><strong>'+Math.round(scores.equity)+'</strong>/100</span></div><div class="row"><span>🛡️ Resilience</span><span><strong>'+Math.round(scores.resilience)+'</strong>/100</span></div><div class="row"><span>🌱 Carbon Reduction</span><span><strong>'+Math.round(scores.carbon)+'</strong>/100</span></div><div class="row"><span>❤️ Community Health</span><span><strong>'+Math.round(scores.health)+'</strong>/100</span></div>');
  w.document.write('<h2>♿ Disability Equity: '+disAssess.title+'</h2><p><em>"'+disAssess.quote+'"</em></p><p style="color:#888">— Maya Chen, 34, West Philadelphia</p>');
  w.document.write('<p class="meta">Generated by SimPhilly 2000<br>meyeringn.github.io/sim-philly-2000<br>Built by Nico Meyering, MPA</p></body></html>');
  w.document.close();w.print();
}

re families spending at my store.",n:"Another opportunity that passed us by. Promises, not paychecks."}],summit:[{r:"maya",y:"Philadelphia showed the country that climate policy and disability justice go together.",n:"We hosted a national summit but couldn't explain our own plan."},{r:"amara",y:"Researchers came to study what's working. North Philly was the model for once.",n:"All those visitors and nothing to show them."}],cold:[{r:"james",y:"They opened a warming center two blocks away. Checked on me every day.",n:"My pipes froze. I'm 72, on a fixed income. Nobody came."},{r:"maya",y:"Warming shelters had accessible cots and charging stations. Small things that mean everything.",n:"Shelters were in church basements with stairs. Disabled people were locked out of safety."}],displace:[{r:"james",y:"They tried to buy my house for half its worth. The neighborhood fought back and won.",n:"My neighbor of 30 years got evicted. She couldn't afford the new rent."},{r:"sofia",y:"The tenant protection program gave me a lawyer. We negotiated.",n:"My rent went up $400. I can't stay. My daughter has to change schools again."}],water:[{r:"amara",y:"We caught it early. Filters went out within 48 hours.",n:"Kids were drinking contaminated water for months before anyone tested."},{r:"maya",y:"They delivered filters to my door because I can't carry them. Accessible crisis response.",n:"Water distribution was at a location with no wheelchair access."}],urbag:[{r:"darnell",y:"The community garden is now a full urban farm. Fresh produce in a food desert.",n:"The money went downtown. Gardens in Kensington still struggle for water."},{r:"amara",y:"My patients are eating better. The prescription produce program works.",n:"An award doesn't fix food insecurity. We need investment, not recognition."}],transitfund:[{r:"maya",y:"New railcars with level boarding. No more gap. I can board independently.",n:"The money went to paint jobs, not accessibility. The gaps are still there."},{r:"darnell",y:"Route 47 is back, running every 10 minutes. My store is busier than ever.",n:"They modernized Center City lines. Kensington still has 1970s buses."}],tidal:[{r:"sofia",y:"The seawall held. My cousin's job at the Navy Yard was protected.",n:"The Navy Yard flooded. Three companies relocated. 5,000 jobs gone."},{r:"james",y:"The monitoring system gave us 72 hours' warning. Everyone prepared.",n:"Nobody told us until the water was rising. The emergency system failed."}],landtrust:[{r:"sofia",y:"My building is in the land trust now. My rent is locked. My daughter can grow up here.",n:"The land trust went to neighborhoods that already have resources. Eastwick was passed over."},{r:"james",y:"The community decides what gets built. Residents have real power over development.",n:"Another program that sounds good but doesn't reach us. Hunting Park wasn't included."}]};

const SM=[{key:"equity",label:"Equity",color:"#e74c3c",icon:"⚖️"},{key:"resilience",label:"Resilience",color:"#3498db",icon:"🛡️"},{key:"carbon",label:"Carbon Reduction",color:"#27ae60",icon:"🌱"},{key:"health",label:"Community Health",color:"#f39c12",icon:"❤️"}];
const GR=[{min:80,g:"A",t:"Climate Champion",m:"Philadelphia is a national model. Other cities are calling."},{min:65,g:"B",t:"Sustainability Leader",m:"Strong progress — but frontline communities need you to keep pushing."},{min:50,g:"C",t:"Making Progress",m:"Some wins, but the climate crisis moves faster than your budget."},{min:35,g:"D",t:"Falling Behind",m:"Philadelphia's most vulnerable are paying the price."},{min:0,g:"F",t:"Climate Crisis",m:"The city is unprepared. The next storm will be catastrophic."}];
const DA=[{min:20,t:"Disability-Forward Governance",q:"My city showed that accessible infrastructure isn't a nice-to-have — it's how you keep people alive.",c:"#4ade80"},{min:12,t:"Partially Accessible",q:"Some investments reached us. But disability inclusion shouldn't be partial — it should be the baseline.",c:"#fbbf24"},{min:0,t:"Disabled Philadelphians Were Left Behind",q:"Cooling centers without ramps. Shelters in church basements with stairs. When you don't plan for Disabled people, you plan against us.",c:"#f87171"}];
const XT=[{n:"Climate Crossover",u:"https://meyeringn.github.io/climate-crossover",d:"Climate career translator"},{n:"Climate Policy Simulator",u:"https://meyeringn.github.io/climate-policy-simulator",d:"Model policy trade-offs"}];
const DIFFS=[{id:"easy",label:"Easy",pts:14,dmgMult:0.7,bonMult:1.2},{id:"normal",label:"Normal",pts:12,dmgMult:1,bonMult:1},{id:"hard",label:"Hard",pts:10,dmgMult:1.3,bonMult:0.8}];
const ROUNDS=4,INIT={equity:32,resilience:28,carbon:22,health:38};
function cl(v){return Math.max(0,Math.min(100,v))}
function gs(t){const v=Object.values(t);const a=v.reduce((x,y)=>x+y,0)/v.length;if(v.every(x=>x<=a*1.6&&x>=a*0.4))return{t:"Balanced Administrator",d:"You spread resources evenly — stability is a choice, but transformative change requires focus."};const s=Object.entries(t).sort(([,x],[,y])=>y-x)[0][0];const m={people:{t:"Community-First Leader",d:"You centered the people most affected. Equity isn't a side goal — it's the strategy."},policy:{t:"Systems Thinker",d:"You invested in the rules that shape everything else. Policy is the multiplier."},parks:{t:"Green Infrastructure Champion",d:"You built the living systems that cool, clean, and protect. Trees are policy."},refuge:{t:"Protector-in-Chief",d:"You prioritized keeping people safe when the climate hits hardest."},transit:{t:"Mobility Champion",d:"You understood that transit connects everything — jobs, health, opportunity, justice."},flood:{t:"Resilience Builder",d:"You invested in infrastructure that will outlast your term."}};return m[s]||{t:"Pragmatic Leader",d:"You made tough calls with limited resources."}}

/* ═══ COMPONENTS ═══ */
function Skyline({hc}){const c=hc?"rgba(0,0,0,0.07)":"rgba(255,255,255,0.05)";return(<svg className="skyline-anim" viewBox="0 0 400 70" style={{width:"100%",maxWidth:340,margin:"0 auto 16px",display:"block"}} aria-hidden="true"><rect x="20" y="40" width="18" height="30" rx="1" fill={c}/><rect x="42" y="30" width="14" height="40" rx="1" fill={c}/><rect x="60" y="45" width="22" height="25" rx="1" fill={c}/><rect x="86" y="22" width="16" height="48" rx="1" fill={c}/><rect x="106" y="35" width="20" height="35" rx="1" fill={c}/><rect x="130" y="8" width="18" height="62" rx="1" fill={c}/><rect x="160" y="25" width="30" height="45" rx="1" fill={c}/><rect x="170" y="6" width="10" height="19" rx="1" fill={c}/><circle cx="175" cy="4" r="2.5" fill={c}/><rect x="200" y="10" width="16" height="60" rx="1" fill={c}/><polygon points="200,10 216,10 208,1" fill={c}/><rect x="222" y="30" width="20" height="40" rx="1" fill={c}/><rect x="246" y="40" width="14" height="30" rx="1" fill={c}/><rect x="264" y="25" width="18" height="45" rx="1" fill={c}/><rect x="286" y="45" width="22" height="25" rx="1" fill={c}/><rect x="312" y="18" width="16" height="52" rx="1" fill={c}/><rect x="332" y="35" width="20" height="35" rx="1" fill={c}/><rect x="356" y="50" width="24" height="3" rx="1" fill={c}/><rect x="360" y="40" width="3" height="12" fill={c}/><rect x="374" y="40" width="3" height="12" fill={c}/><rect x="0" y="68" width="400" height="2" rx="1" fill={c}/></svg>)}
function QR(){const ref=useRef(null);useEffect(()=>{if(!ref.current||ref.current.children.length>0)return;try{const q=qrcode(0,'M');q.addData('https://meyeringn.github.io/sim-philly-2000');q.make();const s=q.getModuleCount();const sz=4;const cv=document.createElement('canvas');cv.width=cv.height=s*sz;const cx=cv.getContext('2d');cx.fillStyle='#1a2744';cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle='#D4A017';for(let r=0;r<s;r++)for(let c=0;c<s;c++)if(q.isDark(r,c))cx.fillRect(c*sz,r*sz,sz,sz);ref.current.appendChild(cv)}catch{}},[]);return <div ref={ref} style={{display:"flex",justifyContent:"center",margin:"8px 0"}}/>}
function ScoreChart({data,t}){if(!data||data.length<2)return null;const W=360,H=150,P={t:12,r:16,b:22,l:32},pW=W-P.l-P.r,pH=H-P.t-P.b;return(<div><svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",display:"block"}} role="img" aria-label="Score evolution chart">{[0,25,50,75,100].map(v=>{const y=P.t+pH-(v/100)*pH;return(<g key={v}><line x1={P.l} y1={y} x2={W-P.r} y2={y} stroke={t.cb} strokeWidth={0.5}/><text x={P.l-4} y={y+3} fontSize={8} fill={t.m} textAnchor="end">{v}</text></g>)})}{data.map((d,i)=>{const x=P.l+(i/(data.length-1))*pW;return <text key={i} x={x} y={H-4} fontSize={8} fill={t.m} textAnchor="middle">{d.year}</text>})}{SM.map(({key,color})=>{const pts=data.map((d,i)=>({x:P.l+(i/(data.length-1))*pW,y:P.t+pH-((d[key]||0)/100)*pH}));const path=pts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");return(<g key={key}><path d={path} fill="none" stroke={color} strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"/>{pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r={3} fill={color} stroke={t.bg} strokeWidth={1.5}/>)}</g>)})}</svg><div className="chart-legend">{SM.map(s=><span key={s.key} style={{color:t.m,fontSize:10,fontWeight:600,display:"flex",alignItems:"center",gap:3}}><span style={{width:10,height:3,borderRadius:2,background:s.color,display:"inline-block"}}/>{s.label}</span>)}</div></div>)}
function SB({label,value,color,icon,delta,hc}){return(<div style={{marginBottom:7}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3,fontWeight:600,color:hc?"#111":"#d0c8b8"}}><span>{icon} {label}</span><span style={{display:"flex",alignItems:"center",gap:4}}>{delta!==undefined&&delta!==0&&<span style={{color:delta>0?"#16a34a":"#dc2626",fontSize:11,fontWeight:700}}>{delta>0?"+":""}{Math.round(delta)}</span>}{Math.round(value)}</span></div><div style={{height:14,borderRadius:7,background:hc?"#ddd":"rgba(255,255,255,0.08)",overflow:"hidden"}}><div className="score-fill" style={{width:cl(value)+"%",background:color}}/></div></div>)}
function Btn({children,onClick,style,disabled,cls}){return <button className={"btn "+(cls||"")} onClick={onClick} disabled={disabled} style={style}>{children}</button>}
function Logo({hc}){return(<div style={{display:"inline-flex",alignItems:"baseline",gap:4}}><span style={{background:"linear-gradient(135deg,#D4A017,#f4d03f)",padding:"1px 8px",fontSize:14,fontWeight:900,color:"#1a1a2e",letterSpacing:1,borderRadius:2}}>SIM</span><span style={{fontSize:18,fontWeight:900,color:hc?"#111":"#fff",letterSpacing:1}}>PHILLY</span><span style={{fontSize:12,fontWeight:700,color:"#D4A017"}}>2000</span></div>)}
function Prog({round,total}){return(<div className="progress">{Array.from({length:total},(_,i)=><div key={i} className={"progress-dot "+(i<round-1?"done":i===round-1?"active":"future")}/>)}</div>)}
function VC({rk,text,hc}){const r=RES[rk];return(<div className="voice-card" style={{background:hc?"#f0f0f0":"rgba(255,255,255,0.04)",border:hc?"1px solid #bbb":"1px solid rgba(255,255,255,0.06)"}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}><span style={{fontSize:18,lineHeight:1}}>{r.icon}</span><div><span style={{fontSize:12,fontWeight:700,color:hc?"#111":"#d0c8b8"}}>{r.name}</span><span style={{fontSize:11,color:hc?"#555":"#778",marginLeft:6}}>{r.age} · {r.loc}</span></div></div><p style={{fontSize:12.5,color:hc?"#333":"#a8a098",margin:0,lineHeight:1.55,fontStyle:"italic"}}>"{text}"</p></div>)}

/* ═══ MAIN ═══ */
function App(){
  const [ph,setPh]=useState("title");
  const [rnd,setRnd]=useState(1);
  const [sc,setSc]=useState({...INIT});
  const [prev,setPrev]=useState(null);
  const [al,setAl]=useState(Object.fromEntries(DEPTS.map(d=>[d.id,0])));
  const [evts,setEvts]=useState([]);
  const [ce,setCe]=useState(null);
  const [er,setEr]=useState(null);
  const [hist,setHist]=useState([]);
  const [sh,setSh]=useState([{year:"Start",...INIT}]);
  const [hc,setHc]=useState(false);
  const [cp,setCp]=useState(false);
  const [tb,setTb]=useState(false);
  const [diff,setDiff]=useState("normal");
  const [mut,setMut]=useState(false);
  const [lb,setLb]=useState(getLB());
  const [saved,setSaved]=useState(false);
  const [carry,setCarry]=useState(null);

  useEffect(()=>{const s=document.getElementById("splash");if(s)setTimeout(()=>s.classList.add("hidden"),300)},[]);
  useEffect(()=>{window.scrollTo({top:0})},[ph,rnd]);
  useEffect(()=>{SFX.muted=mut},[mut]);

  const df=DIFFS.find(d=>d.id===diff)||DIFFS[1];
  const budget=df.pts;
  const spent=Object.values(al).reduce((a,b)=>a+b,0);
  const rem=budget-spent;
  const t=hc?{bg:"#fff",tx:"#111",m:"#444",f:"#888",cb:"#bbb",cg:"#f0f0f0",acc:"#b8860b",abg:"rgba(184,134,11,0.08)",grad:"#f8f8f8"}:{bg:"#10172a",tx:"#e0d8c8",m:"#8890a4",f:"#3a4260",cb:"rgba(255,255,255,0.06)",cg:"rgba(255,255,255,0.03)",acc:"#D4A017",abg:"rgba(212,160,23,0.07)",grad:"radial-gradient(ellipse at 50% 30%,#1f2d50 0%,#10172a 70%)"};

  const start=useCallback(()=>{SFX.init();SFX.play('click');setRnd(1);setSc({...INIT});setPrev(null);setAl(Object.fromEntries(DEPTS.map(d=>[d.id,0])));setEvts([...EV].sort(()=>Math.random()-0.5).slice(0,ROUNDS));setCe(null);setEr(null);setHist([]);setSh([{year:"Start",...INIT}]);setCp(false);setTb(false);setSaved(false);setCarry(null);setPh("intro")},[]);

  const adj=useCallback((dept,delta)=>{SFX.play('click');setAl(prev=>{const next=prev[dept]+delta;const others=Object.entries(prev).filter(([k])=>k!==dept).reduce((s,[,v])=>s+v,0);if(next<0||others+next>budget)return prev;return{...prev,[dept]:next}})},[budget]);

  const confirm=useCallback(()=>{
    SFX.play('click');
    const hasTrust=al.policy>=2;setTb(hasTrust);const mult=hasTrust?1.15:1.0;
    const ns={...sc};
    // Apply carryover penalty
    if(carry){Object.entries(carry).forEach(([k,v])=>{ns[k]=cl(ns[k]+v)})}
    Object.entries(al).forEach(([dept,pts])=>{const factor=dept==="policy"?1.0:mult;Object.entries(IMP[dept]).forEach(([sk,m])=>{ns[sk]=cl(ns[sk]+pts*m*factor)})});
    setPrev({...sc});setSc(ns);
    const ev=evts[rnd-1];setCe(ev);const invested=al[ev.by]||0;const mitigated=invested>=2;
    const rs={...ns};
    if(ev.dmg)Object.entries(ev.dmg).forEach(([k,v])=>{rs[k]=cl(rs[k]+v*df.dmgMult*(mitigated?0.35:1))});
    if(ev.bon)Object.entries(ev.bon).forEach(([k,v])=>{rs[k]=cl(rs[k]+v*df.bonMult*(mitigated?1:0.25))});
    setEr({mit:mitigated,msg:mitigated?ev.ym:ev.nm,before:ns,after:rs});
    setHist(prev=>[...prev,{rnd,al:{...al},eid:ev.id,mit:mitigated}]);
    // Set carryover for next round
    if(!mitigated&&ev.dmg){const worst=Object.entries(ev.dmg).sort(([,a],[,b])=>a-b)[0];setCarry({[worst[0]]:-3})}else{setCarry(null)}
    setTimeout(()=>{mitigated?SFX.play('success'):SFX.play('crisis')},300);
    setPh("event");
  },[sc,al,evts,rnd,df,carry]);

  const resolve=useCallback(()=>{SFX.play('click');setSc(er.after);setSh(prev=>[...prev,{year:"Year "+rnd,...Object.fromEntries(Object.keys(er.after).map(k=>[k,Math.round(er.after[k])]))}]);if(rnd>=ROUNDS){SFX.play('grade');setPh("over");return}setRnd(r=>r+1);setAl(Object.fromEntries(DEPTS.map(d=>[d.id,0])));setPrev(null);setPh("alloc")},[er,rnd]);

  // Keyboard shortcuts
  useEffect(()=>{const h=(e)=>{if(ph!=="alloc")return;const n=parseInt(e.key);if(n>=1&&n<=6){e.preventDefault();const d=DEPTS[n-1];if(e.shiftKey){adj(d.id,-1)}else if(rem>0){adj(d.id,1)}}if((e.key===" "||e.key==="Enter")&&spent>0){e.preventDefault();confirm()}};window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)},[ph,rem,spent,adj,confirm]);

  const avg=Math.round(Object.values(sc).reduce((a,b)=>a+b,0)/4);
  const grade=GR.find(g=>avg>=g.min)||GR[GR.length-1];
  const md=ce?DM[ce.by]:null;
  const totals=useMemo(()=>{const tot=Object.fromEntries(DEPTS.map(d=>[d.id,0]));hist.forEach(h=>{Object.entries(h.al).forEach(([k,v])=>{tot[k]+=v})});return tot},[hist]);
  const gSt=useMemo(()=>gs(totals),[totals]);
  const mitC=hist.filter(h=>h.mit).length;
  const disSc=useMemo(()=>{let s=0;DEPTS.forEach(d=>{s+=((totals[d.id]||0)*(d.dw||0))});return s},[totals]);
  const disA=DA.find(d=>disSc>=d.min)||DA[DA.length-1];

  const share=useCallback(()=>{const txt="🏛️ I just governed Philadelphia in SimPhilly 2000!\n\nGrade: "+grade.g+" — "+grade.t+"\n⚖️ Equity: "+Math.round(sc.equity)+" | 🛡️ Resilience: "+Math.round(sc.resilience)+" | 🌱 Carbon: "+Math.round(sc.carbon)+" | ❤️ Health: "+Math.round(sc.health)+"\nStyle: "+gSt.t+"\nDisability Equity: "+disA.t+"\n\nEvery department is a real climate-justice tool built for Philly.\nhttps://meyeringn.github.io/sim-philly-2000\n#SimPhilly2000 #ClimateEquity #Philadelphia";navigator.clipboard.writeText(txt).then(()=>setCp(true)).catch(()=>{})},[grade,sc,gSt,disA]);

  // Save to leaderboard on game over
  useEffect(()=>{if(ph==="over"&&!saved){setLb(saveLB(grade.g,avg,gSt.t,disA.t));setSaved(true)}},[ph,saved,grade,avg,gSt,disA]);

  const shell={minHeight:"100vh",background:t.bg,color:t.tx,maxWidth:480,margin:"0 auto"};
  const bar={background:"linear-gradient(135deg,#D4A017 0%,#b8860b 100%)",padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"};
  const hcB={background:"none",border:"1px solid "+(hc?"#888":"rgba(255,255,255,0.25)"),borderRadius:6,padding:"4px 8px",fontSize:11,fontWeight:700,color:hc?"#444":"#1a1a2e",cursor:"pointer"};
  const mutB={...hcB,marginRight:4};
  const sec={padding:"16px 20px"};
  const cd=(active,color)=>({background:active?(color+(hc?"22":"10")):t.cg,border:"1px solid "+(active?(color+(hc?"55":"35")):t.cb)});

  const headerBtns=<div style={{display:"flex",alignItems:"center",gap:4}}>
    <button onClick={()=>{setMut(!mut);SFX.play('click')}} style={mutB} aria-label="Toggle sound">{mut?"🔇":"🔊"}</button>
    <button onClick={()=>setHc(!hc)} style={hcB} aria-label="Toggle high contrast">{hc?"◑":"◐"}</button>
  </div>;

  /* ── TITLE ── */
  if(ph==="title")return(
    <div style={shell} className={hc?"hc":""}><div key="title" className="phase" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:32,textAlign:"center",background:t.grad,position:"relative"}}>
      <div style={{position:"absolute",top:16,right:16}}>{headerBtns}</div>
      <Skyline hc={hc}/>
      <div style={{display:"inline-flex",alignItems:"baseline",gap:6,marginBottom:6}}>
        <span style={{background:"linear-gradient(135deg,#D4A017,#f4d03f)",padding:"3px 16px",fontSize:28,fontWeight:900,color:"#1a1a2e",letterSpacing:1,borderRadius:3}}>SIM</span>
        <span style={{fontSize:44,fontWeight:900,color:hc?"#111":"#fff",letterSpacing:4}}>PHILLY</span>
        <span style={{fontSize:24,fontWeight:700,color:"#D4A017"}}>2000</span>
      </div>
      <p style={{fontSize:11,letterSpacing:5,marginBottom:36,color:t.acc,fontWeight:600}}>THE CLIMATE EQUITY CITY BUILDER</p>
      <div style={{display:"flex",gap:16,marginBottom:32,fontSize:28}}>{DEPTS.map(d=><span key={d.id} style={{opacity:0.7}}>{d.icon}</span>)}</div>
      <p style={{fontSize:14,maxWidth:300,lineHeight:1.7,marginBottom:36,color:t.m}}>Plan. Build. Grow Philadelphia.<br/>Can you govern a city through the climate crisis?</p>
      <Btn onClick={start} style={{fontSize:17,padding:"16px 56px",borderRadius:12}}>NEW GAME</Btn>
      {lb.length>0&&<div style={{marginTop:28,width:"100%",maxWidth:280}}>
        <p style={{fontSize:10,fontWeight:700,color:t.f,letterSpacing:1,marginBottom:6}}>LEADERBOARD</p>
        {lb.slice(0,3).map((s,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:11,color:t.m,padding:"3px 0",borderBottom:"1px solid "+t.cb}}><span>{i+1}. {s.sty}</span><span style={{fontWeight:700,color:t.acc}}>{s.g} ({s.avg})</span></div>)}
      </div>}
      <p style={{fontSize:10,marginTop:24,color:t.f,lineHeight:1.7}}>Built with real climate-justice tools by Nico Meyering, MPA<br/>Rated E for Everyone Builds</p>
    </div></div>
  );

  /* ── INTRO ── */
  if(ph==="intro")return(
    <div style={shell} className={hc?"hc":""}><div style={bar}><Logo hc={hc}/>{headerBtns}</div>
    <div key="intro" className="phase" style={sec}>
      <h2 style={{fontSize:22,fontWeight:800,margin:"0 0 16px",color:t.acc}}>Welcome, Mayor.</h2>
      <p style={{fontSize:14,lineHeight:1.75,marginBottom:16,color:t.m}}>Philadelphia faces rising heat, aging infrastructure, transit cuts, and deep environmental injustice — and the communities hit hardest have been disinvested the longest.</p>
      <p style={{fontSize:14,lineHeight:1.75,marginBottom:18,color:t.m}}>You have <strong style={{color:t.acc}}>4 years</strong> to allocate resources across <strong style={{color:t.acc}}>6 departments</strong>. Each year, the city faces a crisis. Your investments determine who's protected.</p>
      <div style={{background:t.abg,border:"1px solid "+(hc?"#ddb":"rgba(212,160,23,0.18)"),borderRadius:10,padding:16,marginBottom:14}}>
        <p style={{fontSize:14,fontWeight:700,color:t.acc,margin:"0 0 4px",fontStyle:"italic"}}>"Every budget is a moral document."</p>
        <p style={{fontSize:12,color:t.m,margin:0}}>Your choices reveal your values. Govern accordingly.</p>
      </div>
      <p style={{fontSize:12,fontWeight:700,color:t.m,margin:"0 0 8px"}}>Difficulty</p>
      <div style={{display:"flex",gap:8,marginBottom:14}}>{DIFFS.map(d=>(
        <button key={d.id} className={"btn "+(diff===d.id?"":"btn-ghost")+(diff===d.id?" active":"")} onClick={()=>{setDiff(d.id);SFX.play('click')}} style={{flex:1,padding:"10px 8px",fontSize:13}}>
          <div style={{fontWeight:700}}>{d.label}</div><div style={{fontSize:10,opacity:0.7,marginTop:2}}>{d.pts} pts/year</div>
        </button>
      ))}</div>
      <div style={{background:hc?"rgba(123,78,163,0.06)":"rgba(123,78,163,0.1)",border:"1px solid "+(hc?"#b8b":"rgba(123,78,163,0.2)"),borderRadius:10,padding:16,marginBottom:14}}>
        <p style={{fontSize:12,fontWeight:700,color:"#9b6ec4",margin:"0 0 4px"}}>📋 Civic Trust Mechanic</p>
        <p style={{fontSize:12,color:t.m,margin:0,lineHeight:1.5}}>Invest 2+ in Policy & Plain Language → all departments get <strong style={{color:t.tx}}>+15%</strong>. Transparent governance multiplies everything.</p>
      </div>
      <div style={{background:t.abg,border:"1px solid "+(hc?"#ddb":"rgba(212,160,23,0.18)"),borderRadius:10,padding:16,marginBottom:24}}>
        <p style={{fontSize:12,color:t.acc,margin:0,fontWeight:700}}>Starting Conditions</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px 16px",marginTop:10}}>{SM.map(s=><span key={s.key} style={{fontSize:12,color:t.m}}>{s.icon} {s.label}: <strong style={{color:t.tx}}>{INIT[s.key]}</strong></span>)}</div>
      </div>
      <Btn onClick={()=>{SFX.play('click');setPh("alloc")}} style={{width:"100%"}}>BEGIN YEAR 1 →</Btn>
    </div></div>
  );

  /* ── ALLOCATE ── */
  if(ph==="alloc")return(
    <div style={shell} className={hc?"hc":""}><div style={bar}><Logo hc={hc}/><div style={{display:"flex",alignItems:"center",gap:6}}>{headerBtns}<span style={{fontWeight:700,fontSize:12,color:"#1a1a2e",opacity:0.7,marginLeft:4}}>Y{rnd}</span></div></div>
    <Prog round={rnd} total={ROUNDS}/>
    <div key={"a"+rnd} className="phase" style={sec} role="region" aria-live="polite">
      {carry&&<div style={{background:"rgba(248,113,113,0.08)",border:"1px solid rgba(248,113,113,0.2)",borderRadius:8,padding:"8px 14px",marginBottom:10,textAlign:"center"}}><span style={{fontSize:12,fontWeight:700,color:"#f87171"}}>⚠ Carryover: last year's unmitigated crisis left lasting damage ({Object.entries(carry).map(([k,v])=>SM.find(s=>s.key===k).icon+" "+v).join(", ")})</span></div>}
      <div style={{marginBottom:12}}>{SM.map(s=><SB key={s.key} label={s.label} value={sc[s.key]} color={s.color} icon={s.icon} hc={hc}/>)}</div>
      {al.policy>=2&&<div style={{background:hc?"rgba(123,78,163,0.08)":"rgba(123,78,163,0.12)",border:"1px solid "+(hc?"#b8b":"rgba(123,78,163,0.25)"),borderRadius:8,padding:"8px 14px",marginBottom:10,textAlign:"center"}}><span style={{fontSize:12,fontWeight:700,color:"#9b6ec4"}}>📋 Civic Trust Bonus Active — +15%</span></div>}
      <div style={{background:rem===0?"rgba(39,174,96,0.1)":t.abg,border:"1px solid "+(rem===0?(hc?"#2a9d4a":"rgba(39,174,96,0.3)"):(hc?"#ddb":"rgba(212,160,23,0.3)")),borderRadius:8,padding:"9px 14px",marginBottom:14,textAlign:"center"}}><span style={{fontSize:13,fontWeight:700,color:rem===0?"#16a34a":t.acc}}>{rem===0?"✓ Budget fully allocated":rem+" point"+(rem!==1?"s":"")+" remaining"}</span></div>
      {DEPTS.map((d,i)=>(
        <div key={d.id} className="dept-card" style={cd(al[d.id]>0,d.bg)}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}><span style={{fontSize:16}}>{d.icon}</span><span style={{fontSize:14,fontWeight:700,color:t.tx}}>{d.name}</span><span style={{fontSize:10,color:t.f,marginLeft:4,opacity:0.6}}>{i+1}</span></div>
              <p style={{fontSize:11,color:t.m,margin:0,lineHeight:1.4}}>{d.desc}</p>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginLeft:14}}>
              <button className="alloc-btn" onClick={()=>adj(d.id,-1)} disabled={al[d.id]<=0} aria-label={"Decrease "+d.name} style={{border:"2px solid "+d.bg,background:"transparent",color:d.bg}}>−</button>
              <span style={{fontSize:26,fontWeight:900,minWidth:30,textAlign:"center",color:al[d.id]>0?d.bg:t.f,transition:"color 0.2s"}}>{al[d.id]}</span>
              <button className="alloc-btn" onClick={()=>adj(d.id,1)} disabled={rem<=0} aria-label={"Increase "+d.name} style={{border:"2px solid "+d.bg,background:rem<=0?"transparent":d.bg,color:rem<=0?d.bg:"#fff"}}>+</button>
            </div>
          </div>
        </div>
      ))}
      <Btn onClick={confirm} disabled={spent===0} style={{width:"100%",marginTop:8}}>{spent===0?"Allocate at least 1 point":"Confirm Year "+rnd+" Budget →"}</Btn>
      <p className="kb-hint">Keys 1-6 to allocate · Shift+key to remove · Enter to confirm</p>
    </div></div>
  );

  /* ── EVENT ── */
  if(ph==="event"&&ce&&er){
    const isGood=!!ce.bon;const voices=VO[ce.id]||[];
    return(<div style={shell} className={hc?"hc":""}><div style={bar}><Logo hc={hc}/><div style={{display:"flex",alignItems:"center",gap:6}}>{headerBtns}<span style={{fontWeight:700,fontSize:12,color:"#1a1a2e",opacity:0.7,marginLeft:4}}>Y{rnd}</span></div></div>
    <Prog round={rnd} total={ROUNDS}/>
    <div key={"e"+rnd} className="phase" style={{padding:"20px 20px 24px"}} role="region" aria-live="polite">
      <div style={{textAlign:"center",marginBottom:8}}><span className="breaking">{isGood?"OPPORTUNITY":"BREAKING"}</span></div>
      <div style={{textAlign:"center",marginBottom:14}}><span style={{fontSize:52}}>{ce.icon}</span></div>
      <h2 className="newsflash" style={{fontSize:19,fontWeight:800,textAlign:"center",margin:"0 0 10px",color:isGood?(hc?"#16a34a":"#4ade80"):(hc?"#dc2626":"#f87171")}}>{ce.title}</h2>
      <p style={{fontSize:13,lineHeight:1.65,textAlign:"center",color:t.m,marginBottom:18}}>{ce.desc}</p>
      <div className="stamp" style={{background:er.mit?(hc?"rgba(22,163,74,0.08)":"rgba(74,222,128,0.07)"):(hc?"rgba(220,38,38,0.08)":"rgba(248,113,113,0.07)"),border:"1px solid "+(er.mit?(hc?"#4a9":"rgba(74,222,128,0.2)"):(hc?"#d66":"rgba(248,113,113,0.2)")),borderRadius:12,padding:16,marginBottom:16,textAlign:"center"}}>
        <p style={{fontSize:14,fontWeight:700,margin:"0 0 6px",color:er.mit?(hc?"#16a34a":"#4ade80"):(hc?"#dc2626":"#f87171")}}>{er.mit?"✓ Your investments paid off":"✗ The city was unprepared"}</p>
        <p style={{fontSize:13,color:t.m,margin:0,lineHeight:1.55}}>{er.msg}</p>
        {tb&&<p style={{fontSize:11,color:"#9b6ec4",margin:"8px 0 0",fontWeight:600}}>📋 Civic Trust Bonus was active</p>}
      </div>
      {md&&<a href={md.url} target="_blank" rel="noopener noreferrer" className="tool-link" style={{background:md.bg+(hc?"15":"0d"),border:"1px solid "+md.bg+(hc?"40":"28"),marginBottom:16}}><span style={{fontSize:22}}>{md.icon}</span><div style={{flex:1}}><span style={{fontSize:12,fontWeight:700,color:md.bg}}>Explore: {md.tool} ↗</span><p style={{fontSize:11,color:t.m,margin:"3px 0 0",lineHeight:1.35}}>{ce.tn}</p></div></a>}
      <div style={{background:hc?"#faf5ea":"rgba(212,160,23,0.05)",border:"1px solid "+(hc?"#e0d0a0":"rgba(212,160,23,0.12)"),borderRadius:10,padding:"12px 14px",marginBottom:16}}>
        <p style={{fontSize:11,fontWeight:700,color:t.acc,margin:"0 0 4px",letterSpacing:0.3}}>GOVERNANCE INSIGHT</p>
        <p style={{fontSize:11.5,color:t.m,margin:0,lineHeight:1.55,fontStyle:"italic"}}>{ce.gi}</p>
      </div>
      {voices.length>0&&<div style={{marginBottom:16}}><p style={{fontSize:11,fontWeight:700,color:t.f,marginBottom:8,letterSpacing:0.5}}>COMMUNITY VOICES</p>{voices.map((v,i)=><VC key={i} rk={v.r} text={er.mit?v.y:v.n} hc={hc}/>)}</div>}
      <div style={{marginBottom:18}}><p style={{fontSize:11,fontWeight:700,color:t.f,marginBottom:8,letterSpacing:0.5}}>SCORE UPDATE</p>{SM.map(s=>{const d=er.after[s.key]-(prev||sc)[s.key];return <SB key={s.key} label={s.label} value={er.after[s.key]} color={s.color} icon={s.icon} delta={d} hc={hc}/>})}</div>
      <Btn onClick={resolve} style={{width:"100%"}}>{rnd>=ROUNDS?"See Governance Report →":"Begin Year "+(rnd+1)+" →"}</Btn>
    </div></div>);
  }

  /* ── GAME OVER ── */
  if(ph==="over"){
    const strongest=[...SM].sort((a,b)=>sc[b.key]-sc[a.key])[0];
    const weakest=[...SM].sort((a,b)=>sc[a.key]-sc[b.key])[0];
    const topD=[...DEPTS].sort((a,b)=>(totals[b.id]||0)-(totals[a.id]||0))[0];
    return(<div style={shell} className={hc?"hc":""}><div style={bar}><Logo hc={hc}/>{headerBtns}</div>
    <div key="over" className="phase" style={{background:hc?t.bg:t.grad,padding:"24px 20px",minHeight:"90vh"}}>
      <div style={{textAlign:"center",marginBottom:22}}>
        <p style={{fontSize:11,color:t.acc,letterSpacing:3,fontWeight:600,marginBottom:14}}>GOVERNANCE REPORT</p>
        <div className="grade-circle" style={{width:90,height:90,borderRadius:"50%",margin:"0 auto 12px",display:"flex",alignItems:"center",justifyContent:"center",background:grade.g<="B"?"linear-gradient(135deg,#D4A017,#f4d03f)":grade.g==="C"?"linear-gradient(135deg,#f39c12,#fbbf24)":"linear-gradient(135deg,#c0392b,#f87171)",fontSize:44,fontWeight:900,color:"#1a1a2e",boxShadow:"0 4px 20px rgba(212,160,23,0.3)"}}>{grade.g}</div>
        <h2 style={{fontSize:22,fontWeight:800,margin:"0 0 6px",color:t.tx}}>{grade.t}</h2>
        <p style={{fontSize:13,color:t.m,margin:"0 0 4px",lineHeight:1.55,maxWidth:340,marginLeft:"auto",marginRight:"auto"}}>{grade.m}</p>
        <p style={{fontSize:12,color:t.f,margin:0}}>Average: {avg}/100 · Mitigated: {mitC}/{ROUNDS} · Difficulty: {df.label}</p>
      </div>
      <div style={{background:t.abg,border:"1px solid "+(hc?"#ddb":"rgba(212,160,23,0.18)"),borderRadius:12,padding:16,marginBottom:16}}>
        <p style={{fontSize:12,fontWeight:700,color:t.acc,margin:"0 0 4px"}}>Your Governance Style</p>
        <p style={{fontSize:16,fontWeight:800,color:t.tx,margin:"0 0 6px"}}>{gSt.t}</p>
        <p style={{fontSize:12.5,color:t.m,margin:0,lineHeight:1.55}}>{gSt.d}</p>
        <p style={{fontSize:11,color:t.f,margin:"10px 0 0"}}>Top: {topD.icon} {topD.name} · Strongest: {strongest.icon} {strongest.label} · Needs work: {weakest.icon} {weakest.label}</p>
      </div>
      <div style={{background:hc?"rgba(100,100,200,0.05)":"rgba(100,100,255,0.05)",border:"1px solid "+(hc?"#aab":"rgba(100,100,255,0.12)"),borderRadius:12,padding:16,marginBottom:16}}>
        <p style={{fontSize:12,fontWeight:700,color:"#818cf8",margin:"0 0 4px"}}>♿ Disability Equity Assessment</p>
        <p style={{fontSize:15,fontWeight:800,color:disA.c,margin:"0 0 8px"}}>{disA.t}</p>
        <p style={{fontSize:12.5,color:t.m,margin:"0 0 10px",lineHeight:1.55}}>More than 250,000 Philadelphians have a disability. Your investments determined whether they were protected or left behind.</p>
        <div className="voice-card" style={{background:hc?"#f0f0f0":"rgba(255,255,255,0.04)",border:hc?"1px solid #bbb":"1px solid rgba(255,255,255,0.06)"}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}><span style={{fontSize:18}}>♿</span><span style={{fontSize:12,fontWeight:700,color:hc?"#111":"#d0c8b8"}}>Maya Chen</span><span style={{fontSize:11,color:hc?"#555":"#778",marginLeft:4}}>34 · West Philadelphia</span></div><p style={{fontSize:12.5,color:hc?"#333":"#a8a098",margin:0,lineHeight:1.55,fontStyle:"italic"}}>"{disA.q}"</p></div>
      </div>
      <div style={{marginBottom:16}}>{SM.map(s=><SB key={s.key} label={s.label} value={sc[s.key]} color={s.color} icon={s.icon} hc={hc}/>)}</div>
      <div style={{background:t.cg,border:"1px solid "+t.cb,borderRadius:12,padding:"14px 10px 6px",marginBottom:16}}><p style={{fontSize:11,fontWeight:700,color:t.f,margin:"0 0 8px 6px",letterSpacing:0.5}}>SCORE EVOLUTION</p><ScoreChart data={sh} t={t}/></div>
      <div style={{marginBottom:16}}>
        <p style={{fontSize:12,fontWeight:700,color:t.acc,marginBottom:10,letterSpacing:0.5}}>EXPLORE THE REAL TOOLS</p>
        {DEPTS.map(d=><a key={d.id} href={d.url} target="_blank" rel="noopener noreferrer" className="tool-link" style={{background:t.cg,border:"1px solid "+t.cb}}><span style={{fontSize:18}}>{d.icon}</span><span style={{fontSize:12.5,fontWeight:700,color:d.bg}}>{d.tool}</span><span style={{fontSize:11,color:t.f,marginLeft:"auto"}}>↗</span></a>)}
        {XT.map(x=><a key={x.n} href={x.u} target="_blank" rel="noopener noreferrer" className="tool-link" style={{background:t.cg,border:"1px solid "+t.cb}}><span style={{fontSize:18}}>🔧</span><span style={{fontSize:12,fontWeight:600,color:t.m}}>{x.n}</span><span style={{fontSize:10,color:t.f,marginLeft:4}}>— {x.d}</span><span style={{fontSize:11,color:t.f,marginLeft:"auto"}}>↗</span></a>)}
      </div>
      <div style={{textAlign:"center",marginBottom:16}}>
        <p style={{fontSize:11,fontWeight:700,color:t.f,marginBottom:6,letterSpacing:0.5}}>SCAN TO PLAY</p>
        <QR/>
        <p style={{fontSize:10,color:t.f}}>meyeringn.github.io/sim-philly-2000</p>
      </div>
      {lb.length>0&&<div style={{background:t.cg,border:"1px solid "+t.cb,borderRadius:10,padding:"12px 14px",marginBottom:16}}>
        <p style={{fontSize:11,fontWeight:700,color:t.f,margin:"0 0 8px"}}>LEADERBOARD</p>
        {lb.map((s,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,color:t.m,padding:"4px 0",borderBottom:"1px solid "+t.cb}}><span>{i+1}. {s.sty}</span><span style={{fontWeight:700,color:t.acc}}>{s.g} ({s.avg}) <span style={{fontSize:10,color:t.f}}>{s.d}</span></span></div>)}
      </div>}
      <div style={{background:t.cg,border:"1px solid "+t.cb,borderRadius:10,padding:"12px 14px",marginBottom:16}}>
        <p style={{fontSize:11,fontWeight:700,color:t.f,margin:"0 0 6px"}}>DATA SOURCES</p>
        <p style={{fontSize:10.5,color:t.m,margin:0,lineHeight:1.65}}>Pew, "Philadelphia 2026" · Brookings, "SE PA Market Assessment" · Pew, "Gen Z Likes Philadelphia" · Pew, "Philadelphia's Guiding Document at 75" · Opportunity Insights</p>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <Btn onClick={share} style={{flex:1,background:cp?"#16a34a":"#D4A017",fontSize:13}}>{cp?"✓ Copied!":"📋 Share"}</Btn>
        <Btn onClick={()=>printReport(grade,sc,gSt,disA,avg)} style={{flex:1,background:"transparent",border:"1px solid "+t.acc,color:t.acc,fontSize:13}}>🖨 Print Report</Btn>
      </div>
      <div style={{background:t.abg,border:"1px solid "+(hc?"#ddb":"rgba(212,160,23,0.12)"),borderRadius:12,padding:16,marginBottom:16,textAlign:"center"}}>
        <p style={{fontSize:12.5,color:t.m,margin:0,lineHeight:1.7}}>Built by <strong style={{color:t.acc}}>Nico Meyering, MPA</strong><br/><span style={{fontSize:11,color:t.f}}>Chairman, Mayor's Commission on People with Disabilities<br/>VP, Net Impact Philly · Board, Disability Pride PA<br/>Steering Committee, Transit Forward Philadelphia</span></p>
      </div>
      <Btn onClick={start} style={{width:"100%"}}>PLAY AGAIN</Btn>
    </div></div>);
  }
  return null;
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
